            word is folded (case-insensitive, Greek accents and final sigma
            ignored — the same folding as the search collation), and every
            word must appear somewhere in the title. So "dr stone" finds
            "Dr. Stone", matching what the public search does with the same
            input. The value is trimmed; more than 100 characters (runes) is a
            422 with violation field "q", code "maxLength" (the bound is
            checked first), and a value within the bound that has no letters
            and no digits means no filter rather than an error.
