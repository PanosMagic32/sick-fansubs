    Problem:
      type: object
      description: >-
        RFC 9457 Problem Details with only accepted safe extensions. Endpoint
        contracts define their stable problem types and violation codes.
      additionalProperties: false
      required:
        - type
        - title
        - status
        - requestId
      properties:
        type:
          type: string
          format: uri-reference
          description: Stable relative problem type identifier.
          example: /problems/validation
        title:
          type: string
          description: Safe developer-oriented summary; not localized UI copy.
        status:
          type: integer
          minimum: 100
          maximum: 599
          description: HTTP status code for this occurrence.
        requestId:
          type: string
          description: Server-generated request correlation identifier.
        violations:
          type: array
          description: Deterministically ordered field violations when applicable.
          items:
            type: object
            additionalProperties: false
            required:
              - field
              - code
            properties:
              field:
                type: string
                description: Accepted public request-field identifier.
              code:
                type: string
                description: Stable machine-readable violation identifier.
    PageInfo:
      type: object
      description: Keyset-pagination continuation metadata.
      additionalProperties: false
      required:
        - hasNextPage
        - endCursor
        - total
      properties:
        hasNextPage:
          type: boolean
        endCursor:
          description: >-
            Versioned, URL-safe opaque cursor for the next page, or null when no
            next page exists. Collection contracts define and strictly bound it.
          type:
            - string
            - "null"
        total:
          type: integer
          minimum: 0
          description: >-
            The filtered row count at read time — the pagination's "of N"
            number. A display value, not a consistency guarantee against
            concurrent writes.
