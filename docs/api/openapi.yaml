          in: query
          required: false
          description: >-
            Opaque versioned cursor from pageInfo.endCursor (namespace
            av1.). At most 256 characters; anything that does not decode is
            a 400.
          schema:
            type: string
            maxLength: 256
        - name: status
          in: query
          required: false
          description: >-
            Exact status filter. One of draft, published,
            archived; absent or empty means every status. Any other value is
            a 422 with violation field "status", code "invalidValue". The
            schema admits the blank form explicitly, so a validating client
            can send what the server accepts.
