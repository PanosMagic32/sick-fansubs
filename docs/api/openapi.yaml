openapi: 3.1.1
info:
  title: Sick-Fansubs HTTP API
  version: "1"
  description: >-
    Accepted Sick-Fansubs wire contracts. Product APIs use /api/v1; operational
    health endpoints are intentionally outside product API versioning.

    Cross-cutting: every endpoint whose chain carries the forced-change gate
    (the authenticated reads chain and the authenticated chain) additionally
    answers 403 with problem type /problems/auth/password-change-required for
    sessions whose account carries the forced-change flag. The /api/v1/auth/
    subtree never carries the gate, so its paths stay reachable while flagged —
    including PUT /api/v1/auth/password, the sign-out pair, the session
    bootstrap, POST /api/v1/auth/reset-password, and
    POST /api/v1/auth/resend-verification.

    Cross-cutting: every documented unsafe operation (POST, PUT, PATCH,
    DELETE) requires the trusted origin and, when a session is present, the
    session-bound X-CSRF-Token header matching the csrfToken returned by the
    session bootstrap — a missing, malformed, or mismatched token is a 403.
    Safe methods never require it, and an unauthenticated unsafe request
    (for example sign-in, register, forgot-password, or reset-password) is
    protected by the trusted origin alone. An expired session has the
    clearing sf_session cookie written before its handler runs, and the
    operations whose handler clears the cookie — sign-out, sign-out-all,
    password change, reset-password, and session revoke — declare it on
    their own response.

    Asset delivery — GET /media/images/{file} — is intentionally outside this
    document. The serving route returns bytes with plain-text errors and
    immutable caching, and the /media/ fallback paths are JSON 404 problems
    kept out of the document by design; their contracts live in
    internal/routes/AGENTS.md and internal/handler/AGENTS.md.

servers:
  - url: /
paths:
  # ── Authentication ──
  /api/v1/auth/sign-in:
    post:
      operationId: signIn
      summary: Authenticate and create a session
      description: >-
        Signs in with username-or-email + password and creates a new opaque
        session. The identifier matches case-insensitively; imported usernames
        keep their legacy spelling, so the lookup also tolerates surrounding
        or repeated whitespace (an ambiguous match fails closed). Rejected with
        403 while already authenticated. Body hard-limit 4 KiB (413 beyond).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SignInRequest"
      responses:
        "200":
          description: Authenticated — session cookie set.
          headers:
            Set-Cookie:
              description: >-
                Opaque sf_session cookie: HttpOnly; SameSite=Lax; Path=/;
                host-only; Max-Age 7 days; Secure in production.
              schema:
                type: string
            X-Request-ID:
              $ref: "#/components/headers/RequestID"
            Cache-Control:
              $ref: "#/components/headers/NoStoreCacheControl"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/InvalidCredentials"
        "403":
          $ref: "#/components/responses/AlreadyAuthenticated"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "422":
          $ref: "#/components/responses/Validation"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/auth/session:
    get:
      operationId: getSession
      summary: Current session state (bootstrap)
      description: >-
        Reports whether the request carries a valid session. Never returns 401 —
        an absent, malformed, or expired session produces the unauthenticated
        envelope. When authenticated, csrfToken and user are always present.
      responses:
        "200":
          description: Current authentication state.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestID"
            Cache-Control:
              $ref: "#/components/headers/NoStoreCacheControl"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionBootstrap"
  /api/v1/auth/sign-out:
    post:
      operationId: signOut
      summary: End the current session
      description: >-
        Deletes the current session and clears the cookie. Idempotent — a missing
        or already-revoked session returns the same 200.
      responses:
        "200":
          description: Session ended — cookie cleared.
          headers:
            Set-Cookie:
              description: >-
                Clears sf_session (empty value, Max-Age 0, the same path and
                scope attributes as the original cookie).
              schema:
                type: string
            X-Request-ID:
              $ref: "#/components/headers/RequestID"
            Cache-Control:
              $ref: "#/components/headers/NoStoreCacheControl"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SignOutResponse"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/auth/sign-out-all:
    post:
      operationId: signOutAll
      summary: End every session for the authenticated user
      description: >-
        Increments auth_version and deletes all session rows atomically, then
        clears the cookie. Idempotent: without a valid session there is
        nothing to revoke, and the call clears the cookie and answers the
        same 200.
      responses:
        "200":
          description: All sessions ended — cookie cleared.
          headers:
            Set-Cookie:
              description: >-
                Clears sf_session (empty value, Max-Age 0, the same path and
                scope attributes as the original cookie).
              schema:
                type: string
            X-Request-ID:
              $ref: "#/components/headers/RequestID"
            Cache-Control:
              $ref: "#/components/headers/NoStoreCacheControl"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SignOutResponse"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/auth/register:
    post:
      operationId: register
      summary: Create an account and sign in
      description: >-
        Immediate account creation (role user, status active) with auto sign-in.
        Email charset: [A-Za-z0-9@._+-] only. Rejected with 403 while already
        authenticated. Body hard-limit 4 KiB (413 beyond). Unknown fields are
        rejected (400) — confirmPassword must not be sent.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "201":
          description: Account created and authenticated — session cookie set.
          headers:
            Location:
              description: Session bootstrap endpoint for the new session.
              schema:
                type: string
                const: /api/v1/auth/session
            Set-Cookie:
              description: >-
                Opaque sf_session cookie: HttpOnly; SameSite=Lax; Path=/;
                host-only; Max-Age 7 days; Secure in production.
              schema:
                type: string
            X-Request-ID:
              $ref: "#/components/headers/RequestID"
            Cache-Control:
              $ref: "#/components/headers/NoStoreCacheControl"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/AlreadyAuthenticated"
        "409":
          $ref: "#/components/responses/Conflict"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "422":
          $ref: "#/components/responses/Validation"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/auth/password:
    put:
      operationId: changePassword
      summary: Change password (revokes all sessions)
      description: >-
        Verifies the current password and replaces it. Increments auth_version
        and deletes all sessions atomically; the cookie is cleared and the user
        must sign in again. Wrong current password returns the same generic 401
        as sign-in. Body hard-limit 4 KiB (413 beyond).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordChangeRequest"
      responses:
        "200":
          description: Password changed — all sessions revoked, cookie cleared.
          headers:
            Set-Cookie:
              description: >-
                Clears sf_session (empty value, Max-Age 0, the same path and
                scope attributes as the original cookie).
              schema:
                type: string
            X-Request-ID:
              $ref: "#/components/headers/RequestID"
            Cache-Control:
              $ref: "#/components/headers/NoStoreCacheControl"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SignOutResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/InvalidCredentials"
        "403":
          $ref: "#/components/responses/Forbidden"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "422":
          $ref: "#/components/responses/Validation"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/auth/forgot-password:
    post:
      operationId: forgotPassword
      summary: Email a self-service password-reset link
      description: >-
        Accepts a username or email and, when an active account matches,
        emails a single-use 30-minute reset link. The response is ALWAYS
        200 with an empty object {} — unknown identifiers and suspended
        accounts are indistinguishable from known ones (enumeration
        resistance). A send/store failure for a KNOWN
        account answers 500 (an honest retryable failure). Rejected with
        403 while already authenticated. Body hard-limit 4 KiB (413
        beyond). Rate limits: 3/IP/hour and 3/identifier/hour.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ForgotPasswordRequest"
      responses:
        "200":
          description: Always — whether or not an email was sent.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestID"
            Cache-Control:
              $ref: "#/components/headers/NoStoreCacheControl"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmptyObject"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/AlreadyAuthenticated"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "422":
          $ref: "#/components/responses/Validation"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/auth/reset-password:
    post:
      operationId: resetPassword
      summary: Consume a reset token and set a new password
      description: >-
        Consumes a single-use reset token and replaces the password. All
        sessions for the account are revoked (auth_version bump) and the
        cookie is cleared when the current session belongs to the reset
        account. Allowed regardless of session state (CSRF applies when a
        session exists). A bad, expired, already-used, or suspended-account
        token answers the generic 422 /problems/auth/reset-token-invalid —
        no distinction (the token is the identity). Password-policy
        violations answer the SAME status with the /problems/validation
        shape (registration's field codes) — but only after the token
        validated, so a bad token plus any password answers token-invalid
        only. Body hard-limit 4 KiB (413 beyond). Rate limit: 5/IP/15min.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResetPasswordRequest"
      responses:
        "204":
          description: Password changed — every session revoked, cookie cleared when applicable.
          headers:
            Set-Cookie:
              description: >-
                Clears sf_session (empty value, Max-Age 0, the same path and
                scope attributes as the original cookie); emitted only when
                the current session belongs to the reset account.
              schema:
                type: string
            X-Request-ID:
              $ref: "#/components/headers/RequestID"
            Cache-Control:
              $ref: "#/components/headers/NoStoreCacheControl"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "422":
          $ref: "#/components/responses/ResetTokenInvalid"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/auth/verify-email:
    post:
      operationId: verifyEmail
      summary: Consume an email-verification token
      description: >-
        Consumes a single-use verification token and stamps the account
        verified. The link is valid for seven days. Idempotent: an
        already-verified user holding a still-valid token (their password
        reset stamped it) also gets 204 — the token is consumed, the stamp
        is a no-op. Allowed regardless of session state (CSRF applies when a
        session exists). No session revocation, no auth_version bump. A bad,
        expired, already-used, or suspended-account token answers the
        generic 422 /problems/auth/verification-token-invalid — no
        distinction. Body hard-limit 4 KiB (413 beyond). Rate limit:
        5/IP/15min.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VerifyEmailRequest"
      responses:
        "204":
          description: Account verified — the token is consumed.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestID"
            Cache-Control:
              $ref: "#/components/headers/NoStoreCacheControl"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "422":
          $ref: "#/components/responses/VerificationTokenInvalid"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/auth/resend-verification:
    post:
      operationId: resendEmailVerification
      summary: Re-send the verification email (authenticated)
      description: >-
        Mints a fresh verification token and emails the link to the
        authenticated user's own address.
        An already-verified user gets the same 204 no-op — nothing is sent.
        Requires a session, the trusted origin, and a valid X-CSRF-Token.
        A send/store failure is an honest 500 (an explicit send never
        silently drops). Rate limit: the SHARED verification-send bucket —
        one verification email per user per 30 minutes across the resend
        and email-change surfaces (no request body).
      responses:
        "204":
          description: Verification email sent, or the account is already verified (no-op).
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestID"
            Cache-Control:
              $ref: "#/components/headers/NoStoreCacheControl"
        "401":
          $ref: "#/components/responses/InvalidCredentials"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"
  # ── Staff user list ──
  /api/v1/users:
    get:
      operationId: listUsers
      summary: List user accounts (staff, moderator+)
      description: >-
        Keyset-paginated staff list of user accounts, newest account first
        (createdAt milliseconds descending, opaque id ascending). Floor: a
        moderator+ session; authenticated role "user" gets 403 and
        unauthenticated requests the generic 401. email appears
        only for admin+ viewers and is omitted entirely from a moderator's
        response. Optional role and status filters restrict the page; an
        unknown value is a 422 with violation field "role"/"status", code
        "invalidValue". limit defaults to 20 and is capped at 100 (the
        shared plumbing); after is the versioned cursor from
        pageInfo.endCursor (namespace uv1.).
      parameters:
        - name: limit
          in: query
          required: false
          description: >-
            Page size. Integers from 1 through 100; absent means 20. A
            non-integer or empty value is a 400; an integer outside the
            range is a 422 with violation field "limit". Duplicate or
            unknown query parameters are rejected.
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: after
          in: query
          required: false
          description: >-
            Opaque versioned cursor from a previous pageInfo.endCursor.
            At most 256 characters; any value that does not decode to a
            valid cursor is a 400.
          schema:
            type: string
            maxLength: 256
        - name: role
          in: query
          required: false
          description: >-
            Restrict the page to one accepted role; absent or empty means
            every role. An unknown value is a 422 with violation field
            "role", code "invalidValue".
          schema:
            anyOf:
              - type: string
                enum:
                  - user
                  - moderator
                  - admin
                  - super-admin
              - type: string
                const: ""
        - name: status
          in: query
          required: false
          description: >-
            Restrict the page to one accepted account status; absent or empty
            means every status. An unknown value is a 422 with violation
            field "status", code "invalidValue".
          schema:
            anyOf:
              - type: string
                enum:
                  - active
                  - suspended
              - type: string
                const: ""
      responses:
        "200":
          description: One page of user accounts, newest first.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestID"
            Cache-Control:
              $ref: "#/components/headers/NoStoreCacheControl"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StaffUserList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/InvalidCredentials"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/Validation"
        "500":
          $ref: "#/components/responses/InternalError"
  # ── Admin password reset ──
  /api/v1/users/{id}/reset-password:
    post:
      operationId: resetUserPassword
      summary: Reset a user's password with a server-generated temp password
      description: >-
        The admin manual reset: generates a 16-character temp password,
        replaces the verifier, sets the forced-change flag, bumps
        auth_version, and deletes the target's sessions and any in-flight
        reset links atomically. The
        plaintext returns ONCE (no-store) for out-of-band handover. Floor:
        admin+ with peer protection — admins may reset moderators and users
        only; super-admins may reset anyone including themselves. A blocked
        403 (floor or peer protection) is audited as a password_reset
        failure; a nonexistent target is the masked 404 and is not audited;
        a failed write (500) is audited as a password_reset failure.
      parameters:
        - $ref: "#/components/parameters/UserID"
      responses:
        "200":
          description: Reset applied — temp password returned once.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestID"
            Cache-Control:
              $ref: "#/components/headers/NoStoreCacheControl"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResetPasswordResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/InvalidCredentials"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
  # ── Role change ──
  /api/v1/users/{id}/role:
    patch:
      operationId: updateUserRole
      summary: Change a user's role (staff)
      description: >-
        Peer-protected role change that revokes the target's sessions.
        Transition policy: a super-admin may change any
        target — including themselves — to any of the four roles; an admin
        may change moderator/user targets between moderator and user only.
        A same-role PATCH is a 200 no-op (no revocation, not audited). The
        last-active-super-admin guard: a change
        that would leave zero ACTIVE super-admins — including self-demotion
        — is a 409 with problem type /problems/auth/last-super-admin.
        Blocked 403s and guarded 409s are audited as role_changed failures;
        the success audit carries targetRole = the NEW role; a failed write
        (500) is audited as a role_changed failure. Body hard-limit 4 KiB
        (413 beyond).
      parameters:
        - $ref: "#/components/parameters/UserID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RoleChangeRequest"
      responses:
        "200":
          description: Role applied (or the no-op) — the updated projection.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestID"
            Cache-Control:
              $ref: "#/components/headers/NoStoreCacheControl"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StaffUser"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/InvalidCredentials"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/LastSuperAdminConflict"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "422":
          $ref: "#/components/responses/Validation"
        "500":
          $ref: "#/components/responses/InternalError"
  # ── Suspend/reactivate ──
  /api/v1/users/{id}/suspend:
    post:
      operationId: suspendUser
      summary: Suspend a user account (staff)
      description: >-
        Peer-protected suspension: sets status = suspended, bumps
        auth_version, and deletes the target's sessions in one transaction,
        so a suspended account cannot sign in and loses every live session.
        No content, role, or profile changes occur. Floor: moderator+ with
        peer protection — super-admins may suspend anyone including
        themselves; admins may suspend moderators and users; moderators may
        suspend users only. Suspending the last ACTIVE super-admin —
        including self-suspension — is a 409 with problem type
        /problems/auth/last-super-admin. A same-status POST is a 200 no-op
        (no revocation, not audited) and sits behind authorization. Blocked
        403s and guarded 409s are audited as user_suspended failures; the
        success audit carries the target's role snapshot, and a failed write
        (500) is audited as a user_suspended failure.
      parameters:
        - $ref: "#/components/parameters/UserID"
      responses:
        "200":
          description: Account suspended (or the no-op) — the updated projection.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestID"
            Cache-Control:
              $ref: "#/components/headers/NoStoreCacheControl"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StaffUser"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/InvalidCredentials"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/LastSuperAdminConflict"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/users/{id}/reactivate:
    post:
      operationId: reactivateUser
      summary: Reactivate a user account (staff)
      description: >-
        Peer-protected reactivation: sets status = active and bumps
        auth_version, requiring a new sign-in (suspension already deleted the
        sessions). Floor and peer protection mirror the suspend endpoint.
        Reactivation can never reduce the active super-admin count, so the
        last-active-super-admin guard does not apply. A same-status POST is a
        200 no-op (no revocation, not audited) and sits behind authorization.
        Blocked 403s are audited as user_reactivated failures; the success
        audit carries the target's role snapshot, and a failed write (500) is
        audited as a user_reactivated failure.
      parameters:
        - $ref: "#/components/parameters/UserID"
      responses:
        "200":
          description: Account reactivated (or the no-op) — the updated projection.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestID"
            Cache-Control:
              $ref: "#/components/headers/NoStoreCacheControl"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StaffUser"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/InvalidCredentials"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
  # ── User deletion ──
  /api/v1/users/{id}:
    delete:
      operationId: deleteUser
      summary: Delete a user account (staff)
      description: >-
        Peer-protected hard delete: every row the account owns cascades
        through the schema's foreign keys — favorites, sessions, its comments
        and their replies, follows, notification rows and read state,
        reset/verification tokens, push subscriptions and preferences — while
        authored blog/project rows survive with creator/updater set NULL (public
        content reads then project the uploader fallback) and the account's
        actor reference on other recipients' notification rows
        is set NULL too (the account's comments do not). Floor: admin+ with peer
        protection — admins may
        delete moderators and users only; super-admins may delete anyone
        including themselves; suspended accounts are deletable like any
        other. Deleting the last ACTIVE super-admin — including
        self-deletion — is a 409 with problem type
        /problems/auth/last-super-admin. Blocked 403s and guarded 409s are
        audited as user_deleted failures; the success audit carries
        targetRole = the role AT deletion time, and a failed write (500) is
        audited as a user_deleted failure. The confirmation step is
        frontend-only.
      parameters:
        - $ref: "#/components/parameters/UserID"
      responses:
        "204":
          description: Account deleted.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestID"
            Cache-Control:
              $ref: "#/components/headers/NoStoreCacheControl"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/InvalidCredentials"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/LastSuperAdminConflict"
        "500":
          $ref: "#/components/responses/InternalError"
  # ── Current user profile ──
  /api/v1/users/me:
    get:
      operationId: getCurrentUserProfile
      summary: Current user's profile
      description: >-
        Full read-only profile of the authenticated user. Auth responses and
        the session bootstrap project only id/username/role, while email and
        avatar come from here when needed. avatarUrl is the ABSOLUTE served
        URL or null when no avatar is set. Unauthenticated requests get the
        same generic 401 as sign-in (no session-state disclosure).
      responses:
        "200":
          description: The authenticated user's profile.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestID"
            Cache-Control:
              $ref: "#/components/headers/NoStoreCacheControl"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfile"
        "401":
          $ref: "#/components/responses/InvalidCredentials"
        "403":
          $ref: "#/components/responses/PasswordChangeRequired"
        "500":
          $ref: "#/components/responses/InternalError"
  # ── Current user email change ──
  /api/v1/users/me/email:
    put:
      operationId: changeCurrentUserEmail
      summary: Change the current user's email
      description: >-
        Swaps the account email after re-authenticating with the CURRENT
        password — the email is the recovery identifier, so a stolen
        session must not reroute recovery. The new
        address starts UNVERIFIED (email_verified_at_ms reset) and a fresh
        verification email is minted + sent after the commit; its failure
        never fails the change (200 either way — the account-page resend
        recovers). A security notice naming the new address is also sent to
        the PREVIOUS address after the commit; its failure never contradicts
        the swap. The swap also deletes the user's verification AND reset
        token rows (an old-address link must not control the account). A
        same-email submission is a 200 no-op (no send, no audit). Wrong
        current password answers the generic 401 (the sign-in outcome) and
        is audited as an email_changed failure. Existing sessions stay
        valid: an email change is not a revocation event (the current
        password was just verified). Requires a session, the
        trusted origin, and a valid X-CSRF-Token; the forced-change gate
        applies. Rate limit: the SHARED verification-send bucket
        (1 per user per 30 minutes) — checked BEFORE the change, over
        limit = 429 and nothing changes. Body hard-limit 4 KiB (413
        beyond).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmailChangeRequest"
      responses:
        "200":
          description: Email changed (or the no-op); the refreshed profile.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestID"
            Cache-Control:
              $ref: "#/components/headers/NoStoreCacheControl"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfile"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/InvalidCredentials"
        "403":
          $ref: "#/components/responses/PasswordChangeRequired"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "422":
          $ref: "#/components/responses/Validation"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"
  # ── Current user avatar upload ──
  /api/v1/users/me/avatar:
    put:
      operationId: setCurrentUserAvatar
      summary: Upload a new avatar for the current user (self-service)
      description: >-
        Self-service avatar upload. ANY authenticated user may set
        their OWN avatar — the admin+ floor of POST /api/v1/media does not
        apply. One step: the file is processed and users.avatar_url is
        updated in the same request (the upload-first split protects
        abandoned content forms; an avatar has none). Multipart/form-data
        with a single "file" part — extra fields are rejected. The whole
        body is bounded (10 MB file + framing); the declared Content-Type
        is ignored (JPEG/PNG/WebP input detected from magic bytes). The
        file is processed to the 200×200 square-crop PNG avatar target and
        stored under a fresh random 32-hex id. Requires a session, the
        trusted origin, and a valid X-CSRF-Token; the forced-change gate
        applies. 200 returns the refreshed UserProfile with the absolute
        served avatarUrl. The previous avatar file is not deleted
        (the orphan sweep reclaims it). A source over 10 MB, over the 2^24
        total-pixel bound, or over the 8192 per-axis bound is a 413 with
        violation file:tooLarge; undecodable bytes are a 422 with
        file:invalidFormat; a missing file part is a 422 with file:required.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - file
              additionalProperties: false
              properties:
                file:
                  type: string
                  format: binary
                  description: The avatar image file (at most 10 MB).
      responses:
        "200":
          description: Avatar processed and applied; the refreshed profile.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestID"
            Cache-Control:
              $ref: "#/components/headers/NoStoreCacheControl"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfile"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/InvalidCredentials"
        "403":
          $ref: "#/components/responses/Forbidden"
        "413":
          $ref: "#/components/responses/MediaTooLarge"
        "422":
          $ref: "#/components/responses/Validation"
        "500":
          $ref: "#/components/responses/InternalError"
