            input. The value is trimmed; more than 100 characters (runes) is a
            422 with violation field "q", code "maxLength" (the bound is
            checked first), and a value within the bound that has no letters
            and no digits means no filter rather than an error.
          schema:
            type: string
            maxLength: 100
      responses:
        "200":
          description: One page of the staff list.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestID"
            Cache-Control:
              $ref: "#/components/headers/NoStoreCacheControl"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StaffProjectList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/InvalidCredentials"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/Validation"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/admin/projects/{id}:
    get:
      operationId: getStaffProject
      summary: Staff detail of one project (any status) with the edit ETag
      description: >-
        Staff detail: the full row — slug, status, revision, both
        timestamps, creator/updater, and the storage-relative thumbnailPath
        the edit form round-trips. Emits the revision-backed strong ETag
        the update/delete send back as If-Match. The draft-visibility gate
        applies: invisible rows answer the same masked 404 as the public
        reads.
      parameters:
        - $ref: "#/components/parameters/ProjectID"
      responses:
        "200":
          description: The staff-shaped row.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestID"
            Cache-Control:
              $ref: "#/components/headers/NoStoreCacheControl"
            ETag:
              description: The revision-backed strong ETag for If-Match.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StaffProject"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/InvalidCredentials"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
  # ── Public content: search ──
  /api/v1/search:
    get:
      operationId: searchContent
      summary: Search published blog posts and projects (newest first by default)
      description: >-
        Public merged full-text search over published blog posts and
        projects. Matching is FTS5 with accent-insensitive Greek (query and
        index text are normalized the same way). The default ordering is
        publishedAt milliseconds descending with the opaque id ascending as
        the final tie-breaker — relevance decides inclusion, recency decides
        order. sort=oldest is its mirror: publishedAt milliseconds ascending
        with the same id tie-breaker. sort=title
        instead orders alphabetically by a Greek-aware collation (Greek
        accents and case ignored, Greek alphabet order, Latin/digit titles
        after Greek ones) with the same id tie-breaker.
        Only rows with
        status "published" and a non-null published timestamp are returned.
        The q text is sanitized (FTS5 specials become separators, reserved
        words are dropped, tokens that leave no searchable letter or number
        are dropped too, and every surviving token is phrase-quoted — the
        last one gets a prefix match when it has at least two runes), so user
        text never reaches FTS5 as syntax. Quoted tokens are ANDed. The
        optional from/to window bounds the publish
        date as inclusive UTC calendar days (YYYY-MM-DD), and from == to is
        that single day. limit defaults to 20 and is capped at 100; after
        is an opaque, versioned cursor from pageInfo.endCursor — it is only
        meaningful when sent with the SAME q, type, sort, and window values
        that produced it, and each sort's cursor is rejected (400) under
        any other sort. The title sort's key is mutable: a title edit
        between page reads can move a row across the cursor boundary (a
        skip or a repeat); the two date sorts walk stable keys.
      parameters:
        - name: q
          in: query
          required: true
          description: >-
            The search text. Trimmed to 1-100 characters (runes). Missing,
            empty, or whitespace-only is a 422 with violation field "q",
            code "required"; over 100 runes is 422 code "maxLength"; text
            that sanitizes down to no searchable token (only specials,
            reserved words, or punctuation/marks — no letter or number) is
            422 code "invalidFormat". Duplicate or unknown query parameters
            are rejected.
          schema:
            type: string
            minLength: 1
            maxLength: 100
        - name: type
          in: query
          required: false
          description: >-
            Which content types to include: all (default), posts, or
            projects. Any other value is a 422 with violation field "type",
            code "invalidValue".
          schema:
            type: string
            enum:
              - all
              - posts
              - projects
            default: all
        - name: sort
          in: query
          required: false
          description: >-
            Result ordering: date (default) is newest first; oldest is
            oldest first; title is the Greek-aware alphabetical order
            described above. Any other value is a 422 with violation field
            "sort", code "invalidValue".
          schema:
            type: string
            enum:
              - date
              - oldest
              - title
            default: date
        - name: from
          in: query
          required: false
          description: >-
            Inclusive lower bound on the publish date, as exactly
            YYYY-MM-DD (UTC day). A value that is not canonical, an
            impossible calendar day, a date before 1970, or an instant
            rather than a day is a 422 with violation field "from", code
            "invalidFormat". Absent means unbounded.
          schema:
            type: string
            pattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2}$"
        - name: to
          in: query
          required: false
          description: >-
            Inclusive upper bound on the publish date, same format and
            validation as from (violation field "to"). A window whose end
            day precedes its start day is a 422 with violation field "to",
            code "invalidValue". Absent means unbounded.
          schema:
            type: string
            pattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2}$"
        - name: limit
          in: query
          required: false
          description: >-
            Page size. Integers from 1 through 100; absent means 20. A
            non-integer or empty value is a 400; an integer outside the
            range is a 422 with violation field "limit", code "outOfRange".
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: after
          in: query
          required: false
          description: >-
            Opaque versioned cursor from a previous pageInfo.endCursor. The
            effective bound is per sort: at most 256 characters for the two
            date sorts, at most 2048 for the title sort (that payload
            carries a text key); the schema states the larger envelope. Any
            value that does not decode to a valid cursor for the requested
            sort is a 400. Only meaningful with the same q, type, sort, and
            from/to window that produced it.
          schema:
            type: string
            maxLength: 2048
      responses:
        "200":
          description: One page of merged search results in the requested order.
          headers:
            X-Request-ID:
              description: Server-generated request correlation identifier.
              schema:
                type: string
            Cache-Control:
              description: API responses default to no-store.
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SearchList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "422":
          $ref: "#/components/responses/Validation"
        "500":
          $ref: "#/components/responses/InternalError"
  # ── Media upload ──
  /api/v1/media:
    post:
      operationId: uploadMedia
      summary: Upload and process a media image (admin+)
      description: >-
        The upload-first flow. Multipart/form-data with a single "file" part —
        extra fields are rejected. The whole body is bounded (10 MB file +
        framing); the declared Content-Type is ignored (JPEG/PNG/WebP input
        is detected from magic bytes). The file is processed to the 1280×720
        JPEG-85/PNG target and stored under a fresh random 32-hex id.
        Requires an admin or super-admin session, the trusted origin, and a
        valid X-CSRF-Token. 201 returns the storage-relative path (the value
        the content forms submit as thumbnailPath) plus the absolute served
        URL; Location is the served URL path. A source over 10 MB, over the
        2^24 total-pixel bound, or over the 8192 per-axis bound is a 413
        with violation file:tooLarge; undecodable bytes are a 422 with
        file:invalidFormat; a missing file part is a 422 with file:required.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - file
              additionalProperties: false
              properties:
                file:
                  type: string
                  format: binary
                  description: The image file (at most 10 MB).
      responses:
        "201":
          description: Image processed and stored.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestID"
            Cache-Control:
              $ref: "#/components/headers/NoStoreCacheControl"
            Location:
              description: The served URL path of the new image.
              schema:
                type: string
                pattern: "^/media/images/[0-9a-f]{32}\\.(jpg|png)$"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MediaUploadResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/InvalidCredentials"
        "403":
          $ref: "#/components/responses/Forbidden"
        "413":
          $ref: "#/components/responses/MediaTooLarge"
        "422":
          $ref: "#/components/responses/Validation"
        "500":
          $ref: "#/components/responses/InternalError"
  # ── Media explicit delete ──
  /api/v1/media/{file}:
    parameters:
      - name: file
        in: path
        required: true
        description: >-
          The served media segment — the last path segment of the upload
          response's url field (<32hex>.<ext>), never hand-built. The
          pipeline writes jpg/png only; .jpeg is parser-tolerated for
          hand-placed legacy files and never matches a written file.
        schema:
          type: string
          pattern: "^[0-9a-f]{32}\\.(jpg|jpeg|png)$"
    delete:
      operationId: deleteMedia
      summary: Delete an uploaded media image (admin+)
      description: >-
        The explicit-deletion terminal state of the upload lifecycle.
        Requires an admin or super-admin session, the
        trusted origin, and a valid X-CSRF-Token. A file referenced by any
        active content row or user avatar is never removed (409
        /problems/conflict); an
        unreferenced file is removed (204). A malformed segment is 400, a
        well-formed unknown file 404. No audit event — deletion is logged,
        not audited (the audited-event list is exhaustive; the upload rules apply unchanged).
      responses:
        "204":
          description: File removed.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestID"
            Cache-Control:
              $ref: "#/components/headers/NoStoreCacheControl"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/InvalidCredentials"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: >-
            The file is referenced by at least one active content row or
            user avatar — it
            is never removed. Problem type /problems/conflict (the shared
            Conflict component's "duplicate race" wording does not apply
            to this endpoint; the operation description is authoritative).
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestID"
            Cache-Control:
              $ref: "#/components/headers/NoStoreCacheControl"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "500":
          $ref: "#/components/responses/InternalError"
  /health/live:
    get:
      operationId: getHealthLive
      summary: Check process liveness
      description: >-
        Reports whether the process can respond. A transient SQLite failure alone
        does not make this check fail.
      responses:
        "200":
          description: The process can respond.
          headers:
            X-Request-ID:
              description: Server-generated request correlation identifier.
              schema:
                type: string
            Cache-Control:
              description: Health responses are not stored.
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - status
                properties:
                  status:
                    type: string
                    const: ok
              example:
                status: ok
  /health/ready:
    get:
      operationId: getHealthReady
      summary: Check application readiness
      description: >-
        Reports readiness after dependencies are initialized, the SQLite schema is
        strictly compatible, and no restore marker exists.
      responses:
        "200":
          description: The application is ready to serve dependency-backed operations.
          headers:
            X-Request-ID:
              description: Server-generated request correlation identifier.
              schema:
                type: string
            Cache-Control:
              description: Health responses are not stored.
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - status
                properties:
                  status:
                    type: string
                    const: ready
              example:
                status: ready
        "503":
          description: The application is not ready.
          headers:
            X-Request-ID:
              description: Server-generated request correlation identifier.
              schema:
                type: string
            Cache-Control:
              description: Health responses are not stored.
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - status
                properties:
                  status:
                    type: string
                    const: not_ready
              example:
                status: not_ready
  # ── Notifications feed ──
  /api/v1/notifications:
    get:
      operationId: listNotifications
      summary: List notification entries (authenticated)
      description: >-
        Keyset-paginated unified feed, newest first (createdAt milliseconds
        descending, opaque id ascending). Two sources: the five account
        audit events — role-weighted against the event's target_role
        snapshot, moderator+ only — and the viewer's own
        user_notifications rows (comment_reply, heart, comment,
        content_updated, new_content, the actorless comment_removed, and the
        STAFF-ONLY draft_activity — the notice about unpublished content,
        whose audience is the draft-visibility gate and whose action rides
        in draftAction). The draft notice is re-gated on READ: below the
        staff floor it is omitted, and at the floor it is served only while
        the viewer is the row's creator or still weighs strictly above the
        creator's current role. A
        viewer sees account events whose
        target's role weighs at or below their own (same-role peers
        included; super-admins see everything); comment items are
        recipient-scoped. Both success and failure audit rows display. Audit
        events the viewer dismissed are absent from the list, the count, and
        the unread badge — the ledger itself keeps every row.
        Floor: an authenticated session (401 unauthenticated; non-staff
        viewers simply get no account events). limit defaults to 20 and is
        capped at 100 (the shared plumbing); after is the
        versioned cursor from pageInfo.endCursor (namespace nv1., one
        tuple across both sources). A null actorUsername is a deleted
        actor or the maintenance actor (rendered as a system label) —
        EXCEPT on comment_removed items, whose null actor is by design
        (the moderator is never named) and renders no actor element; a
        null contentTitle is deleted content (rendered with a generic
        label).
      parameters:
        - name: limit
          in: query
          required: false
          description: >-
            Page size. Integers from 1 through 100; absent means 20. A
            non-integer or empty value is a 400; an integer outside the
            range is a 422 with violation field "limit". Duplicate or
            unknown query parameters are rejected.
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: after
          in: query
          required: false
          description: >-
            Opaque versioned cursor from a previous pageInfo.endCursor.
            At most 256 characters; any value that does not decode to a
            valid cursor is a 400.
          schema:
            type: string
            maxLength: 256
      responses:
        "200":
          description: One page of notification entries, newest first.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestID"
            Cache-Control:
              $ref: "#/components/headers/NoStoreCacheControl"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/InvalidCredentials"
        "422":
          $ref: "#/components/responses/Validation"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/notifications/unread-count:
    get:
      operationId: getNotificationUnreadCount
      summary: Count unread notifications (authenticated)
      description: >-
        The number of notification entries the viewer has not marked read
        — the header badge. The badge sums both sources: the
        staff-visible unread audit events (anti-join on the read table)
        plus the viewer's unread user_notifications rows (read_at_ms IS
        NULL). The user half follows the feed's draft re-gate: below the
        staff floor the draft_activity kind is not counted, and at the
        floor it counts only while the viewer's current weight rule admits
        the row. Never writes. Floor: authenticated (401 unauthenticated).
        No query parameters are accepted.
      responses:
        "200":
          description: The unread count.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestID"
            Cache-Control:
              $ref: "#/components/headers/NoStoreCacheControl"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UnreadCount"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/InvalidCredentials"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/notifications/read-all:
    post:
      operationId: markAllNotificationsRead
      summary: Mark every visible notification read (authenticated)
      description: >-
        Marks every notification entry the viewer can see as read across
        BOTH id spaces in one pass: the staff-visible
        audit events (INSERT OR IGNORE read rows) and the viewer's own
        user_notifications rows (read_at_ms update). Idempotent — repeats
        return 204 with no change. Requires the trusted origin and a valid
        X-CSRF-Token (the authenticated chain).
      responses:
        "204":
          description: All visible entries are marked read.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestID"
            Cache-Control:
              $ref: "#/components/headers/NoStoreCacheControl"
        "401":
          $ref: "#/components/responses/InvalidCredentials"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/notifications/{id}/read:
    parameters:
      - name: id
        in: path
        required: true
        description: >-
          Opaque notification identifier — an audit-event id OR a
          user_notifications id (both id spaces are markable).
        schema:
          type: string
          minLength: 1
          maxLength: 64
          pattern: "^[A-Za-z0-9._~-]{1,64}$"
    post:
      operationId: markNotificationRead
      summary: Mark one notification read (authenticated)
      description: >-
        Marks one notification entry read across both id spaces, with
        per-space authorization: a user_notifications id must
        belong to the viewer; an audit_events id must satisfy the
        role-weighted visibility rule and not be dismissed. Idempotent —
        marking an already-read entry is a 204 no-op. Unknown ids, entries
        outside the viewer's scope, and dismissed entries are deliberately
        the SAME masked 404 (the read operation never reveals that an entry
        exists); a structurally invalid id is a 400. Requires the trusted
        origin and a valid X-CSRF-Token (the authenticated chain).
      responses:
        "204":
          description: The entry is marked read.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestID"
            Cache-Control:
              $ref: "#/components/headers/NoStoreCacheControl"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/InvalidCredentials"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/notifications/clear-read:
    post:
      operationId: clearReadNotifications
      summary: Delete every read notification of the viewer (authenticated)
      description: >-
        Removes the viewer's own READ user_notifications rows in one pass.
        Unread entries always survive — the action can
        never discard something the viewer has not looked at — and the audit
        half of the feed is untouched: dismissing ledger entries belongs to
        the per-item delete and delete-all, never to clear-read. Idempotent
        — a second call deletes nothing and still answers 204. Requires the
        trusted origin and a valid X-CSRF-Token (the authenticated chain).
      responses:
        "204":
          description: Every read event entry is deleted.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestID"
            Cache-Control:
              $ref: "#/components/headers/NoStoreCacheControl"
        "401":
          $ref: "#/components/responses/InvalidCredentials"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/notifications/delete-all:
    post:
      operationId: deleteAllNotifications
      summary: Delete the viewer's whole notification feed (authenticated)
      description: >-
        Empties the viewer's feed in one pass: every user_notifications row
        of the viewer is deleted (read and unread alike; below the staff
        floor the re-gated draft kind is excluded), and every visible audit
        event is dismissed for THIS viewer — the audit ledger rows are never
        deleted and stay visible to other staff under the role-weighted
        rule. Idempotent — a second call finds nothing and still answers
        204. Requires the trusted origin and a valid X-CSRF-Token (the
        authenticated chain).
      responses:
        "204":
          description: The viewer's feed is empty.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestID"
            Cache-Control:
              $ref: "#/components/headers/NoStoreCacheControl"
        "401":
          $ref: "#/components/responses/InvalidCredentials"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/notifications/{id}:
    parameters:
      - name: id
        in: path
        required: true
        description: >-
          Opaque feed-entry identifier — a user_notifications id OR a
          visible audit-event id (both id spaces are deletable).
        schema:
          type: string
          minLength: 1
          maxLength: 64
          pattern: "^[A-Za-z0-9._~-]{1,64}$"
    delete:
      operationId: deleteNotification
      summary: Delete one notification entry from the viewer's feed (authenticated)
      description: >-
        Removes ONE entry from the viewer's feed: a user_notifications row is
        deleted; a visible audit event gets a per-viewer dismissal — the
        entry leaves this viewer's list, count, and badge, while the audit
        ledger row is never deleted and stays visible to other staff under
        the role-weighted rule. Unknown, foreign, invisible, and
        already-dismissed ids are deliberately the SAME masked 404 (deleting
        never reveals that an entry exists). A structurally invalid id is a
        400, and a repeat delete of the same id is a 404 — the entry is gone
        from the feed. Requires the trusted origin and a valid X-CSRF-Token
        (the authenticated chain).
      responses:
        "204":
          description: The entry is removed from the viewer's feed.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestID"
            Cache-Control:
              $ref: "#/components/headers/NoStoreCacheControl"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/InvalidCredentials"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
  # ── Web push ──
  /api/v1/push-subscriptions:
    get:
      operationId: listPushSubscriptions
      summary: List own push subscriptions (authenticated)
      description: >-
        The user's subscription rows (id, endpoint, createdAt) — the
        settings list. Own rows only; oldest first. Floor: authenticated
        (401 unauthenticated). No query parameters are accepted.
      responses:
        "200":
          description: The user's subscription rows (may be empty).
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestID"
            Cache-Control:
              $ref: "#/components/headers/NoStoreCacheControl"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PushSubscriptionList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/InvalidCredentials"
        "500":
          $ref: "#/components/responses/InternalError"
    post:
      operationId: createPushSubscription
      summary: Store or refresh one device subscription (authenticated)
      description: >-
        Stores the browser's PushSubscription JSON (endpoint + p256dh/auth
        keys). 201 + the stored row id — the id is the existing row's id
        when the same endpoint resubscribes (the key material and
        updatedAt refresh in place). An endpoint owned by ANOTHER user is
        reassigned (the device's newest login owns it). The endpoint must
        be an absolute https URL; p256dh/auth must be URL-safe base64
        decoding to exactly 65 and 16 bytes (the RFC 8291 shapes) —
        violations are 422 {field, code}. Unknown body fields are 400;
        body hard-limit 4 KiB (413 beyond). Requires the trusted origin and
        a valid X-CSRF-Token (the authenticated chain).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PushSubscriptionCreate"
      responses:
        "201":
          description: The subscription row is stored.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestID"
            Cache-Control:
              $ref: "#/components/headers/NoStoreCacheControl"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PushSubscriptionCreated"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/InvalidCredentials"
        "403":
          $ref: "#/components/responses/Forbidden"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "422":
          $ref: "#/components/responses/Validation"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/push-subscriptions/{id}:
    parameters:
      - name: id
        in: path
        required: true
        description: >-
          Opaque subscription row id (the create response's id). A
          structurally invalid id is a 400.
        schema:
          type: string
          minLength: 1
          maxLength: 64
          pattern: "^[A-Za-z0-9._~-]{1,64}$"
    delete:
      operationId: deletePushSubscription
      summary: Remove one subscription row (authenticated)
      description: >-
        204 always — the operation is idempotent and user-scoped, and
        unknown/foreign ids are deliberately MASKED (no existence
        disclosure). Requires the trusted origin and a valid X-CSRF-Token
        (the authenticated chain).
      responses:
        "204":
          description: The subscription row (if any) is removed.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestID"
            Cache-Control:
              $ref: "#/components/headers/NoStoreCacheControl"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/InvalidCredentials"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/push-subscriptions/test:
    post:
      operationId: sendTestPush
      summary: Send one test notification to own devices (authenticated)
      description: >-
        Delivers one self-test notification to every device the caller has
        subscribed and reports how many endpoints accepted it, with one
        outcome per attempted endpoint. The
        message rides the REAL delivery path — VAPID signing, the stored
        subscription, the service worker — so it verifies the channel; it is
        not a local notification. No feed row is created, and the per-kind
        preferences are deliberately not consulted: the user asked for this
        message. `delivered: 0` means nothing is subscribed, delivery is disabled on
        this deployment, or every device was rejected by the push service.
        `endpoints` lists the caller's OWN rows with the push-service family
        and the transport verdict, so a client can report whether THIS device
        was the one refused — the aggregate count alone cannot tell that.
        Endpoints carry no URL and no key material. Takes no request body and
        rejects query parameters (400). A device the push service no longer
        knows (404/410) is REMOVED from the subscription list and reported
        with `removed: true`, exactly as the fan-out would. User-keyed rate
        limit: 5 sends per 10 minutes (429 + Retry-After). Requires the
        trusted origin and a valid X-CSRF-Token (the authenticated chain).
      responses:
        "200":
          description: How many of the caller's devices accepted the message.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestID"
            Cache-Control:
              $ref: "#/components/headers/NoStoreCacheControl"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PushTestResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/InvalidCredentials"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/notification-preferences:
    get:
      operationId: getNotificationPreferences
      summary: Read effective push preferences (authenticated)
      description: >-
        Every notification kind the caller's ROLE can hold, with its
        EFFECTIVE push toggle: the stored override row, or the kind's
        default when no row exists. For heart, comment_reply, comment,
        content_updated, new_content, and comment_removed that default is
        moderator+ ON and everyone else OFF; the
        staff-only draft_activity is opt-in at EVERY role and is omitted
        from the list entirely below the moderator floor,
        where a write for it is the masked 404 — a below-floor session
        never sees a toggle that could not fire. The in-app feed is always
        on and unaffected. Floor: authenticated (401 unauthenticated). No
        query parameters are accepted.
      responses:
        "200":
          description: The effective per-kind toggles.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestID"
            Cache-Control:
              $ref: "#/components/headers/NoStoreCacheControl"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationPreferenceList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/InvalidCredentials"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/notification-preferences/{kind}:
    parameters:
      - name: kind
        in: path
        required: true
        description: >-
          The notification kind (heart | comment_reply | comment |
          content_updated | new_content | comment_removed |
          draft_activity). An unknown kind is the masked 404 — a path
          resource — and draft_activity answers the SAME 404 to a session
          below the moderator floor.
        schema:
          type: string
          enum:
            - heart
            - comment_reply
            - comment
            - content_updated
            - new_content
            - comment_removed
            - draft_activity
    put:
      operationId: setNotificationPreference
      summary: Write one explicit push toggle (authenticated)
      description: >-
        Stores an explicit per-kind push toggle (204) — a stored row
        overrides the role default from then on. Repeats overwrite
        (last-write-wins; boolean toggles carry no ETag). Below the
        moderator floor the staff-only draft_activity answers the masked 404
        — the same 404 an unknown kind gets. Requires the trusted origin
        and a valid X-CSRF-Token (the authenticated chain). Body hard-limit
        4 KiB (413 beyond); a missing pushEnabled is 422 {pushEnabled,
        required}.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NotificationPreferenceUpdate"
      responses:
        "204":
          description: The toggle is stored.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestID"
            Cache-Control:
              $ref: "#/components/headers/NoStoreCacheControl"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/InvalidCredentials"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "422":
          $ref: "#/components/responses/Validation"
        "500":
          $ref: "#/components/responses/InternalError"
  # ── Comments ──
  /api/v1/blog-posts/{id}/comments:
    parameters:
      - $ref: "#/components/parameters/BlogPostID"
    get:
      operationId: listBlogPostComments
      summary: List comments on a published blog post
      description: >-
        Public keyset thread list: 20 top-level comments
        per page (limit 1-100), each carrying its inline reply window — at
        most the first 3 replies plus the total replyCount and, while more
        exist, a repliesEndCursor (the sub-pagination contract). Sorted by
        the `sort` tab (top | newest | oldest, default top; each sort's key
        tuple is the comments handler's contract). The session is OPTIONAL: a present
        session fills the viewer-aware `hearted` flag; an anonymous read
        never 401s, and responses stay no-store (they are session-
        dependent). `after` is a SORT-BOUND versioned cursor (namespace
        bc1.; the top sort encodes an extra hearts slot) — a cursor minted
        under one sort is a 400 under another. `focus` is the deep-link
        contract: the server returns the fixed window of the active sort
        containing the anchor (the target itself when top-level, its parent
        when a reply), and when the anchor is a reply outside its parent's
        inline window that parent's window becomes the fixed reply page
        containing it (R4); a deleted/foreign/unknown anchor falls back to
        the first page. focus and after are mutually exclusive (400).
        Unknown, draft, archived, and unstamped content answer the masked
        404. The top sort's key is mutable: a heart committed between page
        reads can move a row across the cursor boundary (a skip or a
        repeat).
      parameters:
        - name: sort
          in: query
          required: false
          description: >-
            Thread order. top = hearts_count desc, createdAt desc, id asc;
            newest = createdAt desc, id asc; oldest = createdAt asc, id
            asc. Default top. An unknown value is a 422 with violation
            field "sort", code "invalidValue" (the enumerated-filter
            precedent).
          schema:
            type: string
            enum:
              - top
              - newest
              - oldest
            default: top
        - name: limit
          in: query
          required: false
          description: >-
            Page size. Integers 1-100; absent means 20. Out-of-range → 422
            {limit, outOfRange}; malformed → 400. Unknown/duplicate query
            parameters are rejected.
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: after
          in: query
          required: false
          description: >-
            Opaque SORT-BOUND cursor from pageInfo.endCursor (namespace
            bc1., at most 256 chars). Using it under a different sort is a
            400; focus and after together are a 400.
          schema:
            type: string
            maxLength: 256
        - name: focus
          in: query
          required: false
          description: >-
            Deep-link comment id (1-64 opaque characters). The server
            computes the anchor and returns the fixed window containing
            it; a deleted anchor returns the first page (the client shows
            the deleted notice). Mutually exclusive with after (400).
          schema:
            type: string
            minLength: 1
            maxLength: 64
            pattern: "^[A-Za-z0-9._~-]{1,64}$"
      responses:
        "200":
          description: One page of top-level comments with their inline reply windows.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestID"
            Cache-Control:
              $ref: "#/components/headers/NoStoreCacheControl"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommentList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/Validation"
        "500":
          $ref: "#/components/responses/InternalError"
    post:
      operationId: createBlogPostComment
      summary: Create a top-level comment
      description: >-
        Creates a top-level comment on published content. Requires a
        session, the trusted origin, and a valid X-CSRF-Token (the
        authenticated chain; the forced-change gate
        applies). The body contract: plain text only, trimmed,
        non-empty, CRLF normalized to LF, at most 5,000 runes, control
        characters rejected (LF and TAB excepted) — violations are
        {body, required}, {body, maxLength}, {body, invalidFormat}. The
        whole request body is bounded at ~32 KiB (413). 201 carries
        Location pointing at the thread list with ?focus=<new id> — the
        deep-link resource (there is no single-comment GET). No
        Idempotency-Key: a double-submitted comment is a visible duplicate
        the author can delete. Unpublished/unknown content is the masked
        404 (the published gate).
        Rate-limited to 10 new comments per 15 minutes per user. The create
        and reply writes share one bucket across both content kinds; 429
        with Retry-After.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CommentBodyRequest"
      responses:
        "201":
          description: The comment was created.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestID"
            Cache-Control:
              $ref: "#/components/headers/NoStoreCacheControl"
            Location:
              description: The thread list with the new comment focused.
              schema:
                type: string
                pattern: "^/api/v1/blog-posts/[A-Za-z0-9._~-]{1,64}/comments\\?focus=[A-Za-z0-9._~-]{1,64}$"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/InvalidCredentials"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "422":
          $ref: "#/components/responses/Validation"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/blog-posts/{id}/comments/count:
    parameters:
      - $ref: "#/components/parameters/BlogPostID"
    get:
      operationId: getBlogPostCommentCount
      summary: Count comments on a published blog post
      description: >-
        The total comment count — top-level plus replies — session-
        independent. Published-only: unknown/draft/
        archived/unstamped content answers the masked 404. No query
        parameters are accepted.
      responses:
        "200":
          description: The total count.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestID"
            Cache-Control:
              $ref: "#/components/headers/NoStoreCacheControl"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommentCount"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/blog-posts/{id}/comments/{commentId}/replies:
    parameters:
      - $ref: "#/components/parameters/BlogPostID"
      - $ref: "#/components/parameters/CommentID"
    get:
      operationId: listBlogPostCommentReplies
      summary: List a top-level comment's replies (ascending)
      description: >-
        One ascending keyset page of a TOP-LEVEL comment's replies — the append after the
        inline reply window a thread item ships. The order is FIXED:
        createdAt asc, id asc, so the cursor is not sort-bound. The session
        is OPTIONAL (a present session fills the viewer-aware `hearted`
        flag); responses stay no-store. `after` comes from the item's
        repliesEndCursor or a previous reply page's endCursor (namespace
        br1.) — a thread cursor (bc1.) is a 400. Unknown/foreign content,
        an unknown parent, and a parent that is itself a reply all answer
        the masked 404.
      parameters:
        - $ref: "#/components/parameters/CommentLimit"
        - $ref: "#/components/parameters/CommentRepliesAfter"
      responses:
        "200":
          description: One page of a top-level comment's replies.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestID"
            Cache-Control:
              $ref: "#/components/headers/NoStoreCacheControl"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommentList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/Validation"
        "500":
          $ref: "#/components/responses/InternalError"
    post:
      operationId: replyToBlogPostComment
      summary: Reply to a top-level comment
      description: >-
        Replies to a TOP-LEVEL comment only — depth 1
        is an API rule. Requires a session, the trusted origin, and CSRF.
        The body follows the create contract. The comment_reply
        notification is written in the SAME transaction as the reply
        (self-replies suppressed) and lands in the parent author's unified
        inbox (a suspended parent author is skipped — the active-recipient
        rule). Reply-to-reply is a 422 with violation field "parentId",
        code "invalidValue"; unknown/deleted/foreign parents and
        unpublished content are the masked 404. 201 carries Location with
        ?focus=<reply id>.
        Rate-limited to 10 new comments per 15 minutes per user. The create
        and reply writes share one bucket across both content kinds; 429
        with Retry-After.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CommentBodyRequest"
      responses:
        "201":
          description: The reply was created (and its notification emitted).
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestID"
            Cache-Control:
              $ref: "#/components/headers/NoStoreCacheControl"
            Location:
              description: The thread list with the new reply focused.
              schema:
                type: string
                pattern: "^/api/v1/blog-posts/[A-Za-z0-9._~-]{1,64}/comments\\?focus=[A-Za-z0-9._~-]{1,64}$"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/InvalidCredentials"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "422":
          $ref: "#/components/responses/Validation"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/blog-posts/{id}/comments/{commentId}:
    parameters:
      - $ref: "#/components/parameters/BlogPostID"
      - $ref: "#/components/parameters/CommentID"
    patch:
      operationId: updateBlogPostComment
      summary: Edit a comment (author only)
      description: >-
        Author-only body edit: the session user must be
        the comment's author (anyone else is a 403); the body follows the
        create contract. Last-write-wins — no ETag (a comment-edit race is
        low-stakes). Returns the updated item (200); the client
        shows the edited marker when updatedAt > createdAt. Unknown/foreign
        comments and unpublished content are the masked 404 (the published
        gate applies to PATCH). Requires the trusted origin + CSRF.
        Rate-limited to 20 edits per 15 minutes per user (429 with
        Retry-After; the bucket is shared across both content kinds).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CommentBodyRequest"
      responses:
        "200":
          description: The updated comment item.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestID"
            Cache-Control:
              $ref: "#/components/headers/NoStoreCacheControl"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Comment"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/InvalidCredentials"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "422":
          $ref: "#/components/responses/Validation"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"
    delete:
      operationId: deleteBlogPostComment
      summary: Delete a comment (author or moderator+)
      description: >-
        Hard delete with full cascade — the comment's replies and hearts
        die with it, no tombstones. The author may
        delete their own comment; moderator+ may delete anyone's. A staff
        deletion of ANOTHER user's comment emits the actorless
        comment_removed notification to that author IN THE SAME
        TRANSACTION (in-app for an active author — a suspended author is
        skipped; push fanned out after the commit; the notice never names
        the moderator) and, after the commit, the ledger-only
        comment_deleted audit event (actor + the comment's author as
        target — the dual-write ledger contract);
        self-deletes — including a staff member deleting their own comment
        — emit none. DELETE is EXEMPT from the
        published-only gate: moderation must work on archived/draft
        content. A non-author below the staff floor on unpublished content
        answers that content's masked 404. Requires the trusted origin + CSRF. 204.
        Rate-limited to 20 deletions per 15 minutes per user (429 with
        Retry-After; the bucket is shared across both content kinds).
      responses:
        "204":
          description: The comment (and its replies/hearts) are gone.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestID"
            Cache-Control:
              $ref: "#/components/headers/NoStoreCacheControl"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/InvalidCredentials"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/blog-posts/{id}/comments/{commentId}/heart:
    parameters:
      - $ref: "#/components/parameters/BlogPostID"
      - $ref: "#/components/parameters/CommentID"
    put:
      operationId: heartBlogPostComment
      summary: Heart a comment (idempotent)
      description: >-
        Hearts a comment. Idempotent 204 on repeat. The heart row, the
        materialized hearts_count delta, and the heart notification to the
        comment author commit in one transaction — a suspended comment
        author is skipped (the active-recipient rule) — the counter cannot
        drift, and an idempotent repeat emits no second notification.
        Hearting the viewer's own comment is a 422 violation {commentId,
        invalidValue} (self-hearts are forbidden). Unpublished content and
        unknown/deleted comments are the masked 404 — the gate applies in
        both directions. Requires the trusted origin + CSRF.
        Rate-limited to 15 heart toggles per 5 minutes per user (429 with
        Retry-After; the bucket is shared across both content kinds).
      responses:
        "204":
          description: The comment is hearted (or already was).
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestID"
            Cache-Control:
              $ref: "#/components/headers/NoStoreCacheControl"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/InvalidCredentials"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/Validation"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"
    delete:
      operationId: unheartBlogPostComment
      summary: Remove a heart from a comment (idempotent)
      description: >-
        Removes the viewer's heart. Idempotent 204
        (removing a non-existent heart succeeds); the counter delta commits
        with the row deletion, and the viewer's heart notification for that
        comment is removed in the same transaction — an unheart never
        leaves a stale notice. A comment hard-delete or an account
        deletion deliberately leaves notices standing (the dangling-ref
        design): a hard-deleted comment's deep link falls back to the
        deleted-target notice; a deleted actor renders as the system
        label. Removing a heart from an own comment stays an idempotent
        204 (the DELETE path skips only the self-ban). The published-only
        gate applies to BOTH directions:
        while the content is unpublished a heart cannot be added or
        removed (the masked 404), so the row and counter freeze and return
        with re-publication. Requires the trusted origin + CSRF.
        Rate-limited to 15 heart toggles per 5 minutes per user (429 with
        Retry-After; the bucket is shared across both content kinds).
      responses:
        "204":
          description: The heart is removed (or was absent).
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestID"
            Cache-Control:
              $ref: "#/components/headers/NoStoreCacheControl"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/InvalidCredentials"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/projects/{id}/comments:
    parameters:
      - $ref: "#/components/parameters/ProjectID"
    get:
      operationId: listProjectComments
      summary: List comments on a published project
      description: >-
        Mirrors the blog thread contract exactly against
        projects — sort tabs, the optional session's hearted flag, the
        SORT-BOUND cursor (namespace pc1.), the focus deep-link window
        (including R4's reply-window shift), the inline reply window with
        replyCount/repliesEndCursor (namespace pr1.), and the masked 404 for
        unpublished/unknown content. The top sort's key has the same
        mutability caveat (a concurrent heart can skip or repeat a row).
      parameters:
        - $ref: "#/components/parameters/CommentSort"
        - $ref: "#/components/parameters/CommentLimit"
        - $ref: "#/components/parameters/CommentAfter"
        - $ref: "#/components/parameters/CommentFocus"
      responses:
        "200":
          description: One page of top-level comments with their inline reply windows.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestID"
            Cache-Control:
              $ref: "#/components/headers/NoStoreCacheControl"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommentList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/Validation"
        "500":
          $ref: "#/components/responses/InternalError"
    post:
      operationId: createProjectComment
      summary: Create a top-level project comment
      description: >-
        Mirrors the blog create contract: the same body
        rules, the same published gate, 201 + Location with ?focus=<new id>.
        Rate-limited to 10 new comments per 15 minutes per user. The create
        and reply writes share one bucket across both content kinds; 429
        with Retry-After.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CommentBodyRequest"
      responses:
        "201":
          description: The comment was created.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestID"
            Cache-Control:
              $ref: "#/components/headers/NoStoreCacheControl"
            Location:
              description: The thread list with the new comment focused.
              schema:
                type: string
                pattern: "^/api/v1/projects/[A-Za-z0-9._~-]{1,64}/comments\\?focus=[A-Za-z0-9._~-]{1,64}$"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/InvalidCredentials"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "422":
          $ref: "#/components/responses/Validation"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/projects/{id}/comments/count:
    parameters:
      - $ref: "#/components/parameters/ProjectID"
    get:
      operationId: getProjectCommentCount
      summary: Count comments on a published project
      description: >-
        Mirrors the blog count contract: total top-level + replies,
        session-independent, published-only (masked 404 otherwise).
      responses:
        "200":
          description: The total count.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestID"
            Cache-Control:
              $ref: "#/components/headers/NoStoreCacheControl"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommentCount"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/projects/{id}/comments/{commentId}/replies:
    parameters:
      - $ref: "#/components/parameters/ProjectID"
      - $ref: "#/components/parameters/CommentID"
    get:
      operationId: listProjectCommentReplies
      summary: List a top-level project comment's replies (ascending)
      description: >-
        Mirrors the blog replies contract: one ascending keyset page
        (createdAt asc, id asc) of a TOP-LEVEL comment's replies, the
        optional session's hearted flag, the reply cursor namespace pr1.,
        the masked 404 for unknown/foreign content or a parent that is
        unknown, foreign, or itself a reply.
      parameters:
        - $ref: "#/components/parameters/CommentLimit"
        - $ref: "#/components/parameters/CommentRepliesAfter"
      responses:
        "200":
          description: One page of a top-level comment's replies.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestID"
            Cache-Control:
              $ref: "#/components/headers/NoStoreCacheControl"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommentList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/Validation"
        "500":
          $ref: "#/components/responses/InternalError"
    post:
      operationId: replyToProjectComment
      summary: Reply to a top-level project comment
      description: >-
        Mirrors the blog reply contract: depth 1, the same 422 for
        reply-to-reply ({parentId, invalidValue}), the masked 404 for
        unknown/foreign parents and unpublished content, and the
        comment_reply notification written in the same transaction
        (self-replies suppressed; a suspended parent author is skipped —
        the active-recipient rule).
        Rate-limited to 10 new comments per 15 minutes per user. The create
        and reply writes share one bucket across both content kinds; 429
        with Retry-After.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CommentBodyRequest"
      responses:
        "201":
          description: The reply was created (and its notification emitted).
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestID"
            Cache-Control:
              $ref: "#/components/headers/NoStoreCacheControl"
            Location:
              description: The thread list with the new reply focused.
              schema:
                type: string
                pattern: "^/api/v1/projects/[A-Za-z0-9._~-]{1,64}/comments\\?focus=[A-Za-z0-9._~-]{1,64}$"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/InvalidCredentials"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "422":
          $ref: "#/components/responses/Validation"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/projects/{id}/comments/{commentId}:
    parameters:
      - $ref: "#/components/parameters/ProjectID"
      - $ref: "#/components/parameters/CommentID"
    patch:
      operationId: updateProjectComment
      summary: Edit a project comment (author only)
      description: >-
        Mirrors the blog edit contract: author only (403 otherwise),
        last-write-wins without ETag, the published gate's masked 404, and
        the 200 updated item.
        Rate-limited to 20 edits per 15 minutes per user (429 with
        Retry-After; the bucket is shared across both content kinds).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CommentBodyRequest"
      responses:
        "200":
          description: The updated comment item.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestID"
            Cache-Control:
              $ref: "#/components/headers/NoStoreCacheControl"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Comment"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/InvalidCredentials"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "422":
          $ref: "#/components/responses/Validation"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"
    delete:
      operationId: deleteProjectComment
      summary: Delete a project comment (author or moderator+)
      description: >-
        Mirrors the blog delete contract: hard cascade (replies + hearts),
        author self-delete or moderator+, the actorless comment_removed
        notification emitted to that comment's author in the same
        transaction (in-app for an active author — a suspended author is
        skipped), the comment_deleted audit event for staff deletions of
        others' comments (emitted after the commit — the dual-write ledger
        contract), and the published-gate exemption. A non-author below
        the staff floor on unpublished content answers that content's
        masked 404.
        Rate-limited to 20 deletions per 15 minutes per user (429 with
        Retry-After; the bucket is shared across both content kinds).
      responses:
        "204":
          description: The comment (and its replies/hearts) are gone.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestID"
            Cache-Control:
              $ref: "#/components/headers/NoStoreCacheControl"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/InvalidCredentials"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/projects/{id}/comments/{commentId}/heart:
    parameters:
      - $ref: "#/components/parameters/ProjectID"
      - $ref: "#/components/parameters/CommentID"
    put:
      operationId: heartProjectComment
      summary: Heart a project comment (idempotent)
      description: >-
        Mirrors the blog heart contract: idempotent 204, the counter delta
        and the heart notification in the heart transaction (a suspended
        author is skipped — the active-recipient rule), the masked 404
        for unpublished content and unknown comments (the gate applies in
        both directions), and the 422
        {commentId, invalidValue} for a self-heart.
        Rate-limited to 15 heart toggles per 5 minutes per user (429 with
        Retry-After; the bucket is shared across both content kinds).
      responses:
        "204":
          description: The comment is hearted (or already was).
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestID"
            Cache-Control:
              $ref: "#/components/headers/NoStoreCacheControl"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/InvalidCredentials"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/Validation"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"
    delete:
      operationId: unheartProjectComment
      summary: Remove a heart from a project comment (idempotent)
      description: >-
        Mirrors the blog unheart contract: idempotent 204 with the counter
        delta and the heart notification removed in the same transaction
        — an unheart never leaves a stale notice (a comment hard-delete or
        an account deletion deliberately does — the dangling-ref design:
        the deleted-target fallback and the system-actor label).
        The published-only gate applies to BOTH directions (the masked
        404), so the row and counter freeze until re-publication.
        Rate-limited to 15 heart toggles per 5 minutes per user (429 with
        Retry-After; the bucket is shared across both content kinds).
      responses:
        "204":
          description: The heart is removed (or was absent).
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestID"
            Cache-Control:
              $ref: "#/components/headers/NoStoreCacheControl"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/InvalidCredentials"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"
  # ── Staff dashboard metrics ──
  /api/v1/staff/metrics:
    get:
      operationId: getStaffMetrics
      summary: Live staff dashboard metrics (moderator+)
      description: >-
        The dashboard's "Στατιστικά" tab: live community totals plus the last
        30 days of activity. Every value is an aggregate
        over existing tables and the audit ledger — no counter columns, no
        summary table, no migration. Floor: a moderator+ session;
        authenticated role "user" gets 403 and unauthenticated requests the
        generic 401. The aggregates are NOT masked per role: the payload
        describes the community as a whole (the feed visibility rule
        governs the notifications feed, not this dashboard). The request
        accepts no query parameters — any parameter, duplicate, or malformed
        query string is a 400.
      responses:
        "200":
          description: The live totals and the last-30-days activity.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestID"
            Cache-Control:
              $ref: "#/components/headers/NoStoreCacheControl"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StaffMetrics"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/InvalidCredentials"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
  # ── Staff logs viewer ──
  /api/v1/staff/logs:
    get:
      operationId: getStaffLogs
      summary: Tail of the application log file (super-admin)
      description: >-
        The dashboard's log tab: the newest records of the application's
        rotated JSON-lines log file (5 MB × 4 files under
        the data directory, no log database). This is a bounded TAIL READ
        over the sink the process itself writes, not a keyset collection, so
        the envelope carries items only: no after, no pageInfo, no total
        (the bounded-tail exception). level is a MINIMUM
        severity; q is a case-insensitive substring over the whole raw
        record, attribute values included; limit caps how many of the newest
        matches are returned. Floor: a super-admin session — a moderator or
        admin gets 403, unauthenticated requests the generic 401. Unknown or
        duplicated query parameters are 400; an unknown level, an
        out-of-range limit, or an over-long q is a 422.
      parameters:
        - name: level
          in: query
          required: false
          description: >-
            Minimum severity: debug, info, warn, or error (case-insensitive).
            Absent means warn, so the default view is warn and error. Any
            other value is a 422 with violation field "level", code
            "invalidValue".
          schema:
            type: string
            enum: [debug, info, warn, error]
            default: warn
        - name: q
          in: query
          required: false
          description: >-
            Case-insensitive substring matched against the whole raw record,
            so it reaches attribute values as well as the message. Absent or
            empty means no filter; longer than 256 characters is a 422 with
            violation field "q", code "maxLength".
          schema:
            type: string
            maxLength: 256
        - name: limit
          in: query
          required: false
          description: >-
            How many of the newest matching records to return. Integers from
            1 through 1000; absent means 100. A non-integer or empty value is
            a 400; an integer outside the range is a 422 with violation field
            "limit", code "outOfRange".
          schema:
            type: integer
            minimum: 1
            maximum: 1000
            default: 100
      responses:
        "200":
          description: The newest matching log records, newest first.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestID"
            Cache-Control:
              $ref: "#/components/headers/NoStoreCacheControl"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StaffLogs"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/InvalidCredentials"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/Validation"
        "500":
          $ref: "#/components/responses/InternalError"
  # ── Staff audit browser ──
  /api/v1/staff/audit-events:
    get:
      operationId: getStaffAuditEvents
      summary: Tail of the audit ledger (super-admin)
      description: >-
        The dashboard's audit browser: the newest rows of the audit ledger.
        This is
        the surface that CARRIES the forensic fields the notifications feed
        withholds — requestId and the client address — and it is super-admin
        only for that reason. Like the logs viewer it is a bounded TAIL read
        over an append-only table, so the envelope is items only: no after, no
        pageInfo, no total; createdAt descending with the id as tie-breaker is
        a total order, and the ledger is bounded by the 365-day
        retention. event is an exact match against the accepted event
        vocabulary; absent or blank means every kind. The NULL identity
        columns are OMITTED from an item rather than sent as empty strings.
      parameters:
        - name: event
          in: query
          required: false
          description: >-
            Exact event name from the audit vocabulary (internal/audit):
            sign_in_success, sign_in_failure, sign_out, sign_out_all,
            password_changed, password_reset, role_changed, user_suspended,
            user_reactivated, user_deleted, content_created, content_updated,
            content_deleted, comment_deleted, password_reset_requested,
            password_reset_completed, email_verified, email_changed,
            session_revoked. Absent or
            BLANK means every kind (a client building the parameter from an
            unselected control gets everything rather than a violation); any
            other value is a 422 with violation field "event", code
            "invalidValue" (never passed to SQL). The schema admits the blank
            form explicitly, so a validating client can send what the server
            accepts.
          schema:
            anyOf:
              - type: string
                enum:
                  - sign_in_success
                  - sign_in_failure
                  - sign_out
                  - sign_out_all
                  - password_changed
                  - password_reset
                  - role_changed
                  - user_suspended
                  - user_reactivated
                  - user_deleted
                  - content_created
                  - content_updated
                  - content_deleted
                  - comment_deleted
                  - password_reset_requested
                  - password_reset_completed
                  - email_verified
                  - email_changed
                  - session_revoked
              - type: string
                const: ""
        - name: limit
          in: query
          required: false
          description: >-
            How many of the newest matching rows to return. Integers from 1
            through 200; absent means 50. A non-integer or empty value is a
            400; an integer outside the range is a 422 with violation field
            "limit", code "outOfRange".
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
      responses:
        "200":
          description: The newest matching ledger rows, newest first.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestID"
            Cache-Control:
              $ref: "#/components/headers/NoStoreCacheControl"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StaffAuditEvents"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/InvalidCredentials"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/Validation"
        "500":
          $ref: "#/components/responses/InternalError"
components:
  headers:
    RequestID:
      description: Server-generated request correlation identifier.
      schema:
        type: string
    NoStoreCacheControl:
      description: API responses default to no-store.
      schema:
        type: string
        const: no-store
  parameters:
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: >-
        Exactly one strong validator ("<revision>") — the staff detail's
        revision-backed ETag. A missing header is 428, a malformed one 400,
        a stale revision 412; weak, list, and duplicate forms are 400.
      schema:
        type: string
        pattern: '^"[1-9][0-9]*"$'
    BlogPostID:
      name: id
      in: path
      required: true
      description: >-
        Opaque public post identifier (1-64 RFC 3986 unreserved characters).
        An id outside this shape is a 400 — structurally invalid input,
        distinct from the masked 404.
      schema:
        type: string
        minLength: 1
        maxLength: 64
        pattern: "^[A-Za-z0-9._~-]{1,64}$"
    ProjectID:
      name: id
      in: path
      required: true
      description: >-
        Opaque public project identifier (1-64 RFC 3986 unreserved
        characters). An id outside this shape is a 400 —
        structurally invalid input, distinct from the masked 404.
      schema:
        type: string
        minLength: 1
        maxLength: 64
        pattern: "^[A-Za-z0-9._~-]{1,64}$"
    UserID:
      name: id
      in: path
      required: true
      description: >-
        Opaque user identifier (1-64 RFC 3986 unreserved characters). An id
        outside this shape is a 400 — structurally invalid input, distinct
        from the masked 404.
      schema:
        type: string
        minLength: 1
        maxLength: 64
        pattern: "^[A-Za-z0-9._~-]{1,64}$"
    CommentID:
      name: commentId
      in: path
      required: true
      description: >-
        Opaque comment identifier (1-64 RFC 3986 unreserved characters). An
        id outside this shape is a 400.
      schema:
        type: string
        minLength: 1
        maxLength: 64
        pattern: "^[A-Za-z0-9._~-]{1,64}$"
    CommentSort:
      name: sort
      in: query
      required: false
      description: >-
        Thread order: top = hearts_count desc, createdAt
        desc, id asc; newest = createdAt desc, id asc; oldest = createdAt
        asc, id asc. Default top. An unknown value is a 422 with violation
        field "sort", code "invalidValue".
      schema:
        type: string
        enum:
          - top
          - newest
          - oldest
        default: top
    CommentLimit:
      name: limit
      in: query
      required: false
      description: >-
        Page size. Integers 1-100; absent means 20. Out-of-range is a 422
        {limit, outOfRange}; malformed values are a 400.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    CommentAfter:
      name: after
      in: query
      required: false
      description: >-
        Opaque SORT-BOUND cursor from pageInfo.endCursor (at most 256
        chars). Using it under a different sort — or together with focus —
        is a 400.
      schema:
        type: string
        maxLength: 256
    CommentFocus:
      name: focus
      in: query
      required: false
      description: >-
        Deep-link comment id (1-64 opaque characters). The server returns
        the fixed window of the active sort containing the anchor (its
        parent when the focus is a reply); when the anchor is a reply
        outside its parent's inline window, that parent's window becomes
        the fixed reply page containing it. A
        deleted/foreign/unknown anchor falls back to the first page.
        Mutually exclusive with after (400); a malformed id is a 400.
      schema:
        type: string
        minLength: 1
        maxLength: 64
        pattern: "^[A-Za-z0-9._~-]{1,64}$"
    CommentRepliesAfter:
      name: after
      in: query
      required: false
      description: >-
        Opaque cursor from a thread item's repliesEndCursor or a previous
        reply page's pageInfo.endCursor (namespace br1./pr1., at most 256
        chars). The reply order is fixed (createdAt asc, id asc), so this
        cursor is not sort-bound; a thread cursor is a 400.
      schema:
        type: string
        maxLength: 256
  schemas:
    PublicUser:
      type: object
      description: Public user projection — id, username, role only.
      additionalProperties: false
      required:
        - id
        - username
        - role
      properties:
        id:
          type: string
          description: 32-char hex user identifier.
        username:
          type: string
        role:
          type: string
          description: Accepted role identifier.
    AuthResponse:
      type: object
      description: >-
        Sign-in/register success envelope. mustChangePassword is the
        forced-change flag: true means the account carries the flag and every
        endpoint on a chain with the forced-change gate answers 403 until the
        password changes (the /api/v1/auth/ subtree stays reachable) — the
        client routes to the change-password form proactively.
      additionalProperties: false
      required:
        - csrfToken
        - user
        - mustChangePassword
      properties:
        csrfToken:
          type: string
          description: Session-bound CSRF token (in-memory on the client).
        user:
          $ref: "#/components/schemas/PublicUser"
        mustChangePassword:
          type: boolean
          description: >-
            True when the account carries the forced-change flag; always
            present (false for a normal sign-in).
    SessionBootstrap:
      type: object
      description: >-
        Current-session envelope. csrfToken is present iff authenticated; user
        is an object when authenticated and null otherwise; mustChangePassword
        is the forced-change flag and is always present (false when
        unauthenticated).
      additionalProperties: false
      required:
        - authenticated
        - user
        - mustChangePassword
      properties:
        authenticated:
          type: boolean
        csrfToken:
          type:
            - string
            - "null"
        user:
          oneOf:
            - $ref: "#/components/schemas/PublicUser"
            - type: "null"
        mustChangePassword:
          type: boolean
    SessionItem:
      type: object
      description: >-
        One active session of the current user. clientLabel
        is the bounded, closed-vocabulary device label captured at sign-in
        (for example "Chrome · Android"), or null when the classifier
        recognized nothing — the raw User-Agent is never stored. createdAt and
        expiresAt are canonical API instants. current marks
        the session that made the request.
      additionalProperties: false
      required:
        - id
        - clientLabel
        - createdAt
        - expiresAt
        - current
      properties:
        id:
          type: string
          description: >-
            Opaque session identifier. Not an authentication credential — the
            session token exists only in the sf_session cookie.
        clientLabel:
          type:
            - string
            - "null"
          description: >-
            Bounded device label from the closed vocabulary, or null when
            unknown (rendered as "unknown device").
        createdAt:
          type: string
          format: date-time
          description: Sign-in instant, canonical UTC RFC 3339 with milliseconds.
        expiresAt:
          type: string
          format: date-time
          description: Absolute expiry instant — the sign-in instant plus seven days.
        current:
          type: boolean
          description: True for the session making this request.
    SessionList:
      type: object
      description: >-
        The GET /api/v1/users/me/sessions body: the
        caller's active sessions plus the reusable keyset pageInfo.
      additionalProperties: false
      required:
        - items
        - pageInfo
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/SessionItem"
        pageInfo:
          $ref: "#/components/schemas/PageInfo"
    UserProfile:
      type: object
      description: >-
        Read-only profile of the current user. avatarUrl is the ABSOLUTE URL
        of the served avatar (base + /media/images/<id>.<ext> — the 2-hex
        storage subdirectory never appears on the wire), null when no avatar
        is set. createdAt is a canonical API instant.
      additionalProperties: false
      required:
        - id
        - username
        - email
        - role
        - emailVerified
        - createdAt
        - avatarUrl
      properties:
        id:
          type: string
          description: Opaque user identifier.
        username:
          type: string
        email:
          type: string
          description: Lowercased account email.
        role:
          type: string
          description: Accepted role identifier.
        emailVerified:
          type: boolean
          description: >-
            Whether the account proved inbox control —
            true for grandfathered imported accounts, verified links, and
            self-service password resets; false for new registrations and
            freshly changed emails.
        createdAt:
          type: string
          format: date-time
          description: Account creation instant, canonical UTC RFC 3339 with milliseconds.
        avatarUrl:
          type:
            - string
            - "null"
          description: >-
            Absolute URL of the served avatar image,
            served through GET /media/images/{file} with immutable caching,
            or null when no avatar is set.
    StaffUser:
      type: object
      description: >-
        One account in the staff user list.
        email is present only when the viewer holds admin or above — a
        moderator's response omits the key entirely. avatarUrl is NOT
        role-gated: it is always present, null when the account has no
        avatar. createdAt is a canonical API instant.
      additionalProperties: false
      required:
        - id
        - username
        - role
        - status
        - emailVerified
        - createdAt
        - avatarUrl
      properties:
        id:
          type: string
          description: Opaque user identifier.
        username:
          type: string
        email:
          type: string
          description: >-
            Lowercased account email. Present only for
            admin+ viewers.
        role:
          type: string
          description: Accepted role identifier.
        status:
          type: string
          enum:
            - active
            - suspended
        emailVerified:
          type: boolean
          description: Whether the account proved inbox control.
        createdAt:
          type: string
          format: date-time
          description: Account creation instant, canonical UTC RFC 3339 with milliseconds.
        avatarUrl:
          type:
            - string
            - "null"
          description: >-
            ABSOLUTE URL of the served avatar image (the 2-hex storage
            subdirectory never appears on the wire), served through
            GET /media/images/{file} with immutable caching, or null when
            the account has no avatar.
    StaffUserList:
      type: object
      description: The staff user-list envelope (items + pageInfo).
      additionalProperties: false
      required:
        - items
        - pageInfo
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/StaffUser"
        pageInfo:
          $ref: "#/components/schemas/PageInfo"
    StaffMetrics:
      type: object
      description: >-
        The GET /api/v1/staff/metrics payload:
        live community totals plus the last-30-days activity. Both sections are
        always present — a fresh database answers zeros, never omitted
        sections.
      additionalProperties: false
      required:
        - totals
        - activity30d
      properties:
        totals:
          $ref: "#/components/schemas/StaffMetricsTotals"
        activity30d:
          $ref: "#/components/schemas/StaffMetricsActivity"
    StaffMetricsTotals:
      type: object
      description: >-
        Live row counts over existing tables. Nothing here is stored: each
        value is a COUNT/GROUP BY over the same rows the application reads.
      additionalProperties: false
      required:
        - users
        - blogPosts
        - projects
        - comments
        - favorites
      properties:
        users:
          $ref: "#/components/schemas/StaffMetricsUserTotals"
        blogPosts:
          $ref: "#/components/schemas/StaffMetricsContentTotals"
        projects:
          $ref: "#/components/schemas/StaffMetricsContentTotals"
        comments:
          type: integer
          description: Blog-post comments plus project comments.
        favorites:
          type: integer
          description: Blog-post favorites plus project favorites.
    StaffMetricsUserTotals:
      type: object
      description: The users breakdown — total plus the role/status partitions.
      additionalProperties: false
      required:
        - total
        - byRole
        - byStatus
      properties:
        total:
          type: integer
        byRole:
          type: object
          description: >-
            One count per accepted role. The key is
            camelCase while the role VALUE stays the schema string
            "super-admin".
          additionalProperties: false
          required:
            - user
            - moderator
            - admin
            - superAdmin
          properties:
            user:
              type: integer
            moderator:
              type: integer
            admin:
              type: integer
            superAdmin:
              type: integer
        byStatus:
          type: object
          description: One count per accepted account status.
          additionalProperties: false
          required:
            - active
            - suspended
          properties:
            active:
              type: integer
            suspended:
              type: integer
    StaffMetricsContentTotals:
      type: object
      description: >-
        One content type's status breakdown. archived ships alongside
        total/published/draft so total equals the sum of its parts on imported
        data (migrated rows carry the archived status).
      additionalProperties: false
      required:
        - total
        - published
        - draft
        - archived
      properties:
        total:
          type: integer
        published:
          type: integer
        draft:
          type: integer
        archived:
          type: integer
    StaffMetricsActivity:
      type: object
      description: >-
        The last-30-days window (a rolling 30×24h duration, not a calendar
        month). since is the window's opening instant in the canonical API
        format, and it is the SAME instant the counts used. The change
        counters cover SUCCESS audit events only — a blocked attempt or a
        failed write is not activity — except signInFailures, whose event name
        is itself the failure signal. activeUsers counts DISTINCT
        sign_in_success actors (sessions carry no last-touch column);
        registrations counts users.created_at_ms rows, not an audit event.
      additionalProperties: false
      required:
        - since
        - registrations
        - activeUsers
        - signInFailures
        - contentCreated
        - contentUpdated
        - contentDeleted
        - commentDeletions
        - usersSuspended
        - usersReactivated
        - usersDeleted
        - roleChanges
      properties:
        since:
          type: string
          format: date-time
          description: The window's opening instant, canonical UTC RFC 3339 with milliseconds.
        registrations:
          type: integer
          description: Accounts created inside the window (users.created_at_ms).
        activeUsers:
          type: integer
          description: DISTINCT actors with a sign_in_success event inside the window.
        signInFailures:
          type: integer
          description: sign_in_failure events inside the window.
        contentCreated:
          type: integer
        contentUpdated:
          type: integer
        contentDeleted:
          type: integer
        commentDeletions:
          type: integer
          description: Staff deletions of another user's comment (comment_deleted).
        usersSuspended:
          type: integer
        usersReactivated:
          type: integer
        usersDeleted:
          type: integer
        roleChanges:
          type: integer
    StaffLogs:
      type: object
      description: >-
        The GET /api/v1/staff/logs body. A
        bounded tail read, so there is no pageInfo and no total: items is the
        newest-first slice the filters and limit selected, and an empty list
        is a valid answer (a fresh install has no log file yet). A record
        that does not parse is skipped rather than failing the request.
      additionalProperties: false
      required:
        - items
      properties:
        items:
          type: array
          description: The newest matching records, newest first.
          items:
            $ref: "#/components/schemas/StaffLogItem"
    StaffLogItem:
      type: object
      description: >-
        One log record. time, level, and msg are the reserved attributes;
        fields carries every other attribute exactly as the process wrote it,
        so an operator sees the real diagnostic context instead of a lossy
        projection. The log never carries emails, tokens, cookies, or
        passwords (the log hygiene rule).
      additionalProperties: false
      required:
        - time
        - level
        - msg
        - fields
      properties:
        time:
          type: string
          format: date-time
          description: The record's instant, canonical UTC RFC 3339 with milliseconds.
        level:
          type: string
          enum: [debug, info, warn, error]
          description: The record's severity, lower-cased to the query vocabulary.
        msg:
          type: string
          description: The record's message.
        fields:
          type: object
          description: >-
            Every remaining structured attribute, untouched. Present as an
            empty object when the record carried none.
          additionalProperties: true
    StaffAuditEvents:
      type: object
      description: >-
        The GET /api/v1/staff/audit-events body. A bounded tail read, so
        there is no pageInfo and no total — items is the newest-first slice
        the filter and limit selected, and an
        empty ledger answers an empty list.
      additionalProperties: false
      required:
        - items
      properties:
        items:
          type: array
          description: The newest matching ledger rows, newest first.
          items:
            $ref: "#/components/schemas/StaffAuditEvent"
    StaffAuditEvent:
      type: object
      description: >-
        One audit-ledger row, including the forensic fields the notifications
        feed withholds (requestId, remoteAddr). The identity columns are
        nullable in the DATABASE; on the wire a NULL is OMITTED here rather
        than sent as an empty string, so a client renders only what actually
        arrived. remoteAddr is the client address resolved by
        middleware.ClientAddr: the left-most
        X-Forwarded-For entry when Caddy supplied one, else the peer address
        without its port.
      additionalProperties: false
      required:
        - id
        - event
        - result
        - requestId
        - remoteAddr
        - createdAt
      properties:
        id:
          type: string
          description: The ledger row's opaque identifier.
        event:
          type: string
          description: The event name from the accepted audit vocabulary.
        result:
          type: string
          enum: [success, failure]
        actorId:
          type: string
          description: The acting account; omitted when the event has no known actor.
        targetId:
          type: string
          description: The affected account; omitted when there is none.
        targetRole:
          type: string
          description: The target's role at the time; omitted when there is none.
        requestId:
          type: string
          description: The request correlation identifier of the audited request.
        remoteAddr:
          type: string
          description: The client address, without a port.
        createdAt:
          type: string
          format: date-time
          description: The row's instant, canonical UTC RFC 3339 with milliseconds.
    ResetPasswordResponse:
      type: object
      description: >-
        The one-time plaintext temp password.
        The password exists only in this response — the operator hands it
        over out of band; the response is always no-store.
      additionalProperties: false
      required:
        - password
      properties:
        password:
          type: string
          minLength: 16
          maxLength: 16
          description: 16-character temp password from the unambiguous alphabet.
    RoleChangeRequest:
      type: object
      description: >-
        The PATCH /api/v1/users/{id}/role body.
        The value must be one of the accepted roles; anything else is a 422
        with violation field "role", code "invalidValue". Unknown fields are
        rejected (strict decode).
      additionalProperties: false
      required:
        - role
      properties:
        role:
          type: string
          enum:
            - user
            - moderator
            - admin
            - super-admin
    FavoriteItem:
      type: object
      description: >-
        One favorite list item — the search-card look
        without the type badge (the favorites tabs separate the types).
        subtitle is the blog post's display subtitle and is empty for
        projects (they have none). favoritedAt is the favorite's creation
        instant; publishedAt the content's publish instant. Both canonical
        API instants.
      additionalProperties: false
      required:
        - id
        - title
        - subtitle
        - description
        - thumbnailUrl
        - publishedAt
        - favoritedAt
        - commentCount
        - favoriteCount
      properties:
        id:
          type: string
          description: Opaque content identifier.
        title:
          type: string
        subtitle:
          type: string
          description: The blog post's display subtitle; empty for projects.
        description:
          type: string
        thumbnailUrl:
          type: string
          description: Absolute media URL (mediaURL); empty string, never null,
            when the stored value fails the scheme guard.
        publishedAt:
          type: string
          format: date-time
        favoritedAt:
          type: string
          format: date-time
        commentCount:
          type: integer
          minimum: 0
          description: Total comments on the content — top-level plus replies.
        favoriteCount:
          type: integer
          minimum: 0
          description: Total favorites on the content — live-derived, never materialized.
    FavoriteList:
      type: object
      description: Keyset collection envelope.
      additionalProperties: false
      required:
        - items
        - pageInfo
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/FavoriteItem"
        pageInfo:
          $ref: "#/components/schemas/PageInfo"
    FavoriteStatus:
      type: object
      description: Favorite-status envelope for one published content id.
      additionalProperties: false
      required:
        - favorited
      properties:
        favorited:
          type: boolean
    FollowStatus:
      type: object
      description: >-
        Follow-status envelope for one published content id (the favorites mirror).
      additionalProperties: false
      required:
        - following
      properties:
        following:
          type: boolean
    SignOutResponse:
      type: object
      additionalProperties: false
      required:
        - authenticated
      properties:
        authenticated:
          type: boolean
          const: false
    SignInRequest:
      type: object
      additionalProperties: false
      required:
        - identifier
        - password
      properties:
        identifier:
          type: string
          maxLength: 256
          description: Username or email (case-insensitive lookup).
        password:
          type: string
          maxLength: 128
    RegisterRequest:
      type: object
      additionalProperties: false
      required:
        - username
        - email
        - password
      properties:
        username:
          type: string
          minLength: 1
          maxLength: 128
          pattern: "^\\s*[a-zA-Z0-9]+(\\s+[a-zA-Z0-9]+)*\\s*$"
          description: >-
            Normalized before validation: trimmed, and every whitespace run
            collapsed to one space, so "  John   Doe " registers as "John
            Doe". The normalized name is 1–32 ASCII letters/digits with
            single inner spaces; the pattern admits the raw spellings that
            normalize to that shape, and maxLength bounds the raw string.
        email:
          type: string
          maxLength: 254
          pattern: "^[A-Za-z0-9@._+-]+$"
          description: ASCII only — Latin letters, digits, and standard email punctuation.
        password:
          type: string
          minLength: 8
          maxLength: 72
          description: >-
            Policy: 8–72 bytes (the server counts bytes, not code points),
            no null bytes — the registration rules.
    PasswordChangeRequest:
      type: object
      additionalProperties: false
      required:
        - currentPassword
        - newPassword
      properties:
        currentPassword:
          type: string
          maxLength: 128
        newPassword:
          type: string
          minLength: 8
          maxLength: 72
          description: >-
            Policy: 8–72 bytes (the server counts bytes, not code points),
            no null bytes — the registration rules.
    ForgotPasswordRequest:
      type: object
      additionalProperties: false
      required:
        - identifier
      properties:
        identifier:
          type: string
          maxLength: 256
          description: Username or email (case-insensitive lookup, the sign-in canonicalization).
    ResetPasswordRequest:
      type: object
      additionalProperties: false
      required:
        - token
        - password
      properties:
        token:
          type: string
          minLength: 43
          maxLength: 43
          description: The base64url reset token from the emailed link.
        password:
          type: string
          minLength: 8
          maxLength: 72
          description: "The new password (policy: 8–72 bytes, no null bytes — the registration rules)."
    VerifyEmailRequest:
      type: object
      additionalProperties: false
      required:
        - token
      properties:
        token:
          type: string
          minLength: 43
          maxLength: 43
          description: The base64url verification token from the emailed link.
    EmailChangeRequest:
      type: object
      additionalProperties: false
      required:
        - email
        - currentPassword
      properties:
        email:
          type: string
          maxLength: 254
          description: The new email address (registration's ASCII rule, lowercased server-side).
        currentPassword:
          type: string
          maxLength: 128
          description: The current password — required re-authentication (the email is the recovery identifier).
    EmptyObject:
      type: object
      additionalProperties: false
      description: The enumeration-safe empty success body.
    BlogPostListItem:
      type: object
      description: >-
        Public card projection of one blog post for list pages: the cards
        carry the description (clamped by the UI), the last-change instant,
        and the creator ref. Downloads and the updater stay on the detail
        contract.
      additionalProperties: false
      required:
        - id
        - title
        - subtitle
        - description
        - thumbnailUrl
        - publishedAt
        - updatedAt
        - commentCount
        - favoriteCount
        - creator
      properties:
        id:
          type: string
          description: Opaque public identifier (1-64 RFC 3986 unreserved characters).
        title:
          type: string
        subtitle:
          type: string
          description: May be empty.
        description:
          type: string
          description: Plain-text body — the target treats description as text, not markup.
        thumbnailUrl:
          type: string
          description: >-
            Absolute URL of the served thumbnail, constructed from the configured
            public base URL and the stored relative media path.
            Served through GET /media/images/{file} with immutable caching.
            An empty string (not null) is emitted when the stored value
            fails the scheme guard.
        publishedAt:
          type: string
          format: date-time
          description: Canonical UTC RFC 3339 with exactly millisecond precision.
          example: "2026-07-23T12:34:56.789Z"
        updatedAt:
          type: string
          format: date-time
          description: >-
            Canonical UTC RFC 3339 instant of the last representation change.
            Emitted for future card use; the current UI does not render it.
        commentCount:
          type: integer
          minimum: 0
          description: Total comments on the post — top-level plus replies.
        favoriteCount:
          type: integer
          minimum: 0
          description: Total favorites on the post — live-derived, never materialized.
        creator:
          oneOf:
            - $ref: "#/components/schemas/BlogPostUserRef"
            - type: "null"
          description: >-
            The post creator after the uploader fallback (see
            BlogPostUserRef); null only when no fallback account resolves.
    BlogPostList:
      type: object
      description: Keyset-paginated collection envelope.
      additionalProperties: false
      required:
        - items
        - pageInfo
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/BlogPostListItem"
        pageInfo:
          $ref: "#/components/schemas/PageInfo"
    BlogPostDetail:
      type: object
      description: >-
        Public detail of one published blog post. description is
        plain text; creator and updater carry id, username, and a guarded
        avatarUrl (roles are account state and never appear on public
        content); downloads preserve the stored display order.
      additionalProperties: false
      required:
        - id
        - title
        - subtitle
        - description
        - thumbnailUrl
        - publishedAt
        - updatedAt
        - commentCount
        - favoriteCount
        - creator
        - updater
        - downloads
      properties:
        id:
          type: string
          description: Opaque public identifier (1-64 RFC 3986 unreserved characters).
        title:
          type: string
        subtitle:
          type: string
          description: May be empty.
        description:
          type: string
          description: Plain-text body — the target treats description as text, not markup.
        thumbnailUrl:
          type: string
          description: >-
            Absolute URL of the served thumbnail, constructed from the configured
            public base URL and the stored relative media path. An empty
            string (not null) is emitted when the stored value fails the
            scheme guard.
        publishedAt:
          type: string
          format: date-time
          description: Canonical UTC RFC 3339 with exactly millisecond precision.
          example: "2026-07-23T12:34:56.789Z"
        updatedAt:
          type: string
          format: date-time
          description: >-
            Canonical UTC RFC 3339 instant of the last representation change
            (updated_at_ms). Always present; display policy
            (e.g. showing it only when a post was meaningfully edited) is the
            UI slice's decision. Note: migration falls back to created_at_ms
            when the legacy record has no updatedAt, so the value alone does
            not prove the post was edited.
          example: "2026-07-24T08:15:00.000Z"
        commentCount:
          type: integer
          minimum: 0
          description: Total comments on the post — top-level plus replies.
        favoriteCount:
          type: integer
          minimum: 0
          description: Total favorites on the post — live-derived, never materialized.
        creator:
          oneOf:
            - $ref: "#/components/schemas/BlogPostUserRef"
            - type: "null"
          description: >-
            The post creator after the uploader fallback (see
            BlogPostUserRef); null only when no fallback account resolves.
        updater:
          oneOf:
            - $ref: "#/components/schemas/BlogPostUserRef"
            - type: "null"
          description: >-
            The user who last changed the post, after the same uploader
            fallback; null only when no fallback account resolves.
        downloads:
          type: array
          description: >-
            Download choices ordered by their stored position.
            Link fields are null when the resolution has no link or the
            stored value does not parse as http(s)/magnet.
          items:
            $ref: "#/components/schemas/BlogPostDownload"
    BlogPostUserRef:
      type: object
      description: >-
        Public user projection on content responses (creator and updater
        share this shape): id, username, and avatar — never role (account
        state stays off public content). Public list and detail responses
        apply the uploader fallback: a ref without an avatar borrows the
        fallback account's picture, and an absent ref becomes the fallback
        account as a whole — so creator/updater is null there only when no
        fallback account resolves; the staff schemas keep the raw refs.
        avatarUrl is null when no avatar and no fallback picture resolve; a
        stored value that fails the scheme guard counts as absent (public
        responses then borrow the fallback picture, staff responses emit
        null).
      additionalProperties: false
      required:
        - id
        - username
        - avatarUrl
      properties:
        id:
          type: string
          description: Opaque public user identifier.
        username:
          type: string
        avatarUrl:
          type:
            - string
            - "null"
          description: Absolute avatar URL, or null when absent.
    BlogPostDownload:
      type: object
      description: One download choice.
      additionalProperties: false
      required:
        - resolution
        - magnetUrl
        - torrentUrl
      properties:
        resolution:
          type: string
          description: Resolution label, e.g. "1080p" or "2160p".
          example: "1080p"
        magnetUrl:
          type:
            - string
            - "null"
          description: >-
            Magnet link, or null when absent or not a plausible magnet URI.
        torrentUrl:
          type:
            - string
            - "null"
          description: >-
            Torrent download URL, or null when absent or not a plausible
            http(s) URL.
    StaffBlogDownload:
      type: object
      description: >-
        One stored download row as the STAFF detail returns it: the stored
        links VERBATIM — no link guard (unlike BlogPostDownload) — so the
        edit form shows what is stored and a malformed value can be fixed;
        null means no link for that
        slot.
      additionalProperties: false
      required:
        - resolution
        - magnetUrl
        - torrentUrl
      properties:
        resolution:
          type: string
          description: Resolution label, e.g. "1080p" or "2160p".
          example: "1080p"
        magnetUrl:
          type:
            - string
            - "null"
          description: The stored magnet link verbatim, or null.
        torrentUrl:
          type:
            - string
            - "null"
          description: The stored torrent link verbatim, or null.
    ProjectListItem:
      type: object
      description: >-
        Public card projection of one project for list pages.
        The projects table has no subtitle; cards
        carry the slug (data only — projects are addressed by opaque id)
        and the description. thumbnailUrl is null when the stored value
        fails the scheme guard.
      additionalProperties: false
      required:
        - id
        - title
        - description
        - slug
        - thumbnailUrl
        - publishedAt
        - updatedAt
        - commentCount
        - favoriteCount
        - creator
      properties:
        id:
          type: string
          description: Opaque public identifier (1-64 RFC 3986 unreserved characters).
        title:
          type: string
        description:
          type: string
          description: Plain-text body — the target treats description as text, not markup.
        slug:
          type: string
          description: >-
            Unique latin-transliterated slug. A data
            field used for search; projects are addressed by opaque id,
            never by slug.
        thumbnailUrl:
          type:
            - string
            - "null"
          description: >-
            Absolute URL of the served thumbnail, constructed from the
            configured public base URL and the stored relative media path.
            Null when the stored value fails the scheme
            guard — thumbnail_url is NOT NULL in storage, so null means
            masked, never absent.
        publishedAt:
          type: string
          format: date-time
          description: Canonical UTC RFC 3339 with exactly millisecond precision.
          example: "2026-07-23T12:34:56.789Z"
        updatedAt:
          type: string
          format: date-time
          description: >-
            Canonical UTC RFC 3339 instant of the last representation
            change (updated_at_ms). Migration falls back
            to created_at_ms when the legacy record has no updatedAt, so
            the value alone does not prove the project was edited.
          example: "2026-07-24T08:15:00.000Z"
        commentCount:
          type: integer
          minimum: 0
          description: Total comments on the project — top-level plus replies.
        favoriteCount:
          type: integer
          minimum: 0
          description: Total favorites on the project — live-derived, never materialized.
        creator:
          oneOf:
            - $ref: "#/components/schemas/ProjectUserRef"
            - type: "null"
          description: >-
            The project creator after the uploader fallback (see
            ProjectUserRef): migrated rows without a creator resolve to the
            fallback account, so null appears only when no fallback account
            resolves.
    ProjectList:
      type: object
      description: Keyset-paginated collection envelope.
      additionalProperties: false
      required:
        - items
        - pageInfo
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ProjectListItem"
        pageInfo:
          $ref: "#/components/schemas/PageInfo"
    SearchListItem:
      type: object
      description: >-
        One merged search hit. type discriminates the
        content type so the client links to /blog/{id} or /projects/{id}.
        Subtitle is the blog post's display line; projects have none, so
        their hits carry an empty string and the key is present on every
        item. thumbnailUrl follows the scheme guard (a stored value that is
        not a plausible http(s) URL or local media reference is emitted as
        null).
      additionalProperties: false
      required:
        - type
        - id
        - title
        - subtitle
        - description
        - thumbnailUrl
        - publishedAt
        - commentCount
        - favoriteCount
      properties:
        type:
          type: string
          enum:
            - post
            - project
        id:
          type: string
          description: Opaque public identifier (1-64 RFC 3986 unreserved characters).
        title:
          type: string
        subtitle:
          type: string
          description: >-
            The blog post's display subtitle; empty for projects, which
            have no subtitle field.
        description:
          type: string
          description: Plain-text description — the target treats description as text, not markup.
        thumbnailUrl:
          type:
            - string
            - "null"
          description: >-
            Absolute thumbnail URL, or null when the stored value fails the
            scheme guard.
        publishedAt:
          type: string
          description: Canonical UTC RFC 3339 instant with millisecond precision.
        commentCount:
          type: integer
          minimum: 0
          description: Total comments on the content — top-level plus replies.
        favoriteCount:
          type: integer
          minimum: 0
          description: Total favorites on the content — live-derived, never materialized.
    SearchList:
      type: object
      description: Keyset-paginated merged search envelope.
      additionalProperties: false
      required:
        - items
        - pageInfo
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/SearchListItem"
        pageInfo:
          $ref: "#/components/schemas/PageInfo"
    ProjectDetail:
      type: object
      description: >-
        Public detail of one published project.
        description is plain text; creator and updater carry id, username,
        and a guarded avatarUrl (roles are account state and never appear
        on public content); downloads preserve the stored display order.
        No subtitle — the projects table has none.
      additionalProperties: false
      required:
        - id
        - title
        - description
        - slug
        - thumbnailUrl
        - publishedAt
        - updatedAt
        - commentCount
        - favoriteCount
        - creator
        - updater
        - downloads
      properties:
        id:
          type: string
          description: Opaque public identifier (1-64 RFC 3986 unreserved characters).
        title:
          type: string
        description:
          type: string
          description: Plain-text body — the target treats description as text, not markup.
        slug:
          type: string
          description: >-
            Unique latin-transliterated slug. A data
            field used for search; projects are addressed by opaque id,
            never by slug.
        thumbnailUrl:
          type:
            - string
            - "null"
          description: >-
            Absolute URL of the served thumbnail, constructed from the
            configured public base URL and the stored relative media path.
            Null when the stored value fails the scheme
            guard.
        publishedAt:
          type: string
          format: date-time
          description: Canonical UTC RFC 3339 with exactly millisecond precision.
          example: "2026-07-23T12:34:56.789Z"
        updatedAt:
          type: string
          format: date-time
          description: >-
            Canonical UTC RFC 3339 instant of the last representation
            change (updated_at_ms).
          example: "2026-07-24T08:15:00.000Z"
        commentCount:
          type: integer
          minimum: 0
          description: Total comments on the project — top-level plus replies.
        favoriteCount:
          type: integer
          minimum: 0
          description: Total favorites on the project — live-derived, never materialized.
        creator:
          oneOf:
            - $ref: "#/components/schemas/ProjectUserRef"
            - type: "null"
          description: >-
            The project creator after the uploader fallback (see
            ProjectUserRef); null only when no fallback account resolves.
        updater:
          oneOf:
            - $ref: "#/components/schemas/ProjectUserRef"
            - type: "null"
          description: >-
            The user who last changed the project, after the same uploader
            fallback; null only when no fallback account resolves.
        downloads:
          type: array
          description: >-
            Batch-download entries ordered by their stored position.
            Link fields are null when the entry has no
            link or the stored value does not parse as http(s)/magnet.
          items:
            $ref: "#/components/schemas/ProjectDownload"
    ProjectUserRef:
      type: object
      description: >-
        Public user projection on project responses (creator and updater
        share this shape): id, username, and avatar — never role (account
        state stays off public content). Public list and detail responses
        apply the uploader fallback: a ref without an avatar borrows the
        fallback account's picture, and an absent ref becomes the fallback
        account as a whole — so creator/updater is null there only when no
        fallback account resolves; the staff schemas keep the raw refs.
        avatarUrl is null when no avatar and no fallback picture resolve; a
        stored value that fails the scheme guard counts as absent (public
        responses then borrow the fallback picture, staff responses emit
        null).
      additionalProperties: false
      required:
        - id
        - username
        - avatarUrl
      properties:
        id:
          type: string
          description: Opaque public user identifier.
        username:
          type: string
        avatarUrl:
          type:
            - string
            - "null"
          description: Absolute avatar URL, or null when absent.
    StaffProjectDownload:
      type: object
      description: >-
        One stored download row as the STAFF detail returns it: the stored
        links VERBATIM — no link guard (unlike ProjectDownload) — so the
        edit form shows what is stored and a malformed value can be fixed;
        null means no link for that
        slot.
      additionalProperties: false
      required:
        - name
        - magnetUrl
        - torrentUrl
      properties:
        name:
          type: string
          description: Batch entry name, e.g. "Season 01 — 1080p".
          example: "Season 01 — 1080p"
        magnetUrl:
          type:
            - string
            - "null"
          description: The stored magnet link verbatim, or null.
        torrentUrl:
          type:
            - string
            - "null"
          description: The stored torrent link verbatim, or null.
    ProjectDownload:
      type: object
      description: One batch-download entry.
      additionalProperties: false
      required:
        - name
        - magnetUrl
        - torrentUrl
      properties:
        name:
          type: string
          description: Batch entry name, e.g. "Season 01 — 1080p".
          example: "Season 01 — 1080p"
        magnetUrl:
          type:
            - string
            - "null"
          description: >-
            Magnet link, or null when absent or not a plausible magnet URI.
        torrentUrl:
          type:
            - string
            - "null"
          description: >-
            Torrent download URL, or null when absent or not a plausible
            http(s) URL.
    ProjectDownloadWrite:
      type: object
      description: >-
        One row of the project write DTO's downloads array. name is trimmed
        1-100 runes; each link is at most 2000 runes and must parse as an
        http(s) URL with a host or a magnet URI (the public read's grammar)
        — otherwise 422
        {downloads[i].magnetUrl|torrentUrl, invalidFormat}; at least one of
        the two links must be non-empty — 422 {downloads[i], required}.
      additionalProperties: false
      required:
        - name
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
          description: Batch entry name, e.g. "Season 01 — 1080p".
          example: "Season 01 — 1080p"
        magnetUrl:
          type:
            - string
            - "null"
          maxLength: 2000
          description: Magnet link (magnet:?…), or null/absent for none.
        torrentUrl:
          type:
            - string
            - "null"
          maxLength: 2000
          description: Torrent download URL (http(s) with a host), or
            null/absent for none.
    ProjectCreate:
      type: object
      description: >-
        The staff project CREATE body. title is
        trimmed 1-200 runes; description 0-20000; thumbnailPath is a
        validated storage-relative media reference (the 2-hex subdirectory
        must equal the id's first two hex characters); status is draft|published
        (default published). There is NO slug field — the slug is generated
        server-side from the title, and an unknown slug key is a 400 under
        the strict body reader. downloads is REQUIRED (1-20 rows).
      additionalProperties: false
      required:
        - title
        - thumbnailPath
        - downloads
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
        description:
          type: string
          maxLength: 20000
          default: ""
        thumbnailPath:
          type: string
          pattern: "^media/images/[0-9a-f]{2}/[0-9a-f]{32}\\.(jpg|png)$"
          description: >-
            Storage-relative media reference (validated to exist); the 2-hex
            subdirectory must equal the id's first two hex characters.
        status:
          type: string
          enum:
            - draft
            - published
          description: >-
            draft|published (default published); archived is accepted only
            on update (an edit-time lifecycle state).
        downloads:
          type: array
          minItems: 1
          maxItems: 20
          items:
            $ref: "#/components/schemas/ProjectDownloadWrite"
          description: >-
            The full download-row set in display order (position = array
            index). Empty or missing is a 422 {downloads, required}; more
            than 20 rows is a 422 {downloads, maxItems}.
    ProjectUpdate:
      type: object
      description: >-
        The staff project UPDATE body: the create fields plus the
        optional slug. The slug is admin+-only (a moderator-submitted slug
        is a 403); it must match ^[a-z0-9]+(-[a-z0-9]+)*$ within 1-100
        runes (422 {slug, invalidFormat}), and a duplicate slug is a 422
        {slug, alreadyTaken}. An absent slug keeps the existing one.
        downloads is REQUIRED (1-20 rows, full replacement).
      additionalProperties: false
      required:
        - title
        - thumbnailPath
        - downloads
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
        description:
          type: string
          maxLength: 20000
          default: ""
        slug:
          type: string
          minLength: 1
          maxLength: 100
          pattern: "^[a-z0-9]+(-[a-z0-9]+)*$"
          description: >-
            Admin+-only. Lowercase latin letters, digits, and single hyphens
            (no leading/trailing/double hyphens). Absent keeps the current
            slug.
        thumbnailPath:
          type: string
          pattern: "^media/images/[0-9a-f]{2}/[0-9a-f]{32}\\.(jpg|png)$"
          description: >-
            Storage-relative media reference (validated to exist); the 2-hex
            subdirectory must equal the id's first two hex characters.
        status:
          type: string
          enum:
            - draft
            - published
            - archived
          description: >-
            draft|published|archived (default published); archived is an
            edit-time lifecycle state.
        downloads:
          type: array
          minItems: 1
          maxItems: 20
          items:
            $ref: "#/components/schemas/ProjectDownloadWrite"
          description: >-
            The full download-row set in display order (position = array
            index). Empty or missing is a 422 {downloads, required}; more
            than 20 rows is a 422 {downloads, maxItems}.
    StaffProject:
      type: object
      description: >-
        The staff-read representation: the public detail fields
