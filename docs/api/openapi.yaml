  /api/v1/users/me/sessions/{id}:
    parameters:
      - name: id
        in: path
        required: true
        description: >-
          Opaque session identifier (RFC 3986 unreserved, 1-64 chars) from a
          listSessions item. It is not an authentication credential.
        schema:
          type: string
          pattern: "^[A-Za-z0-9._~-]{1,64}$"
    delete:
      operationId: revokeSession
      summary: Revoke one of the current user's sessions (idempotent)
      description: >-
        Deletes one session by id, scoped to the authenticated owner: another
        user's id, an unknown id, and an already-revoked id all answer the
        same 204 and change nothing. The user's other
        sessions and auth_version are untouched — this is a per-session
        revocation, not a security-state reset. Revoking the CURRENT session
        behaves like sign-out: the row is deleted and the sf_session cookie
        is cleared after the commit. Requires the trusted origin and a valid
        X-CSRF-Token.
      responses:
        "204":
          description: Session revoked (or already absent).
          headers:
            Set-Cookie:
              description: >-
                Clears sf_session (empty value, Max-Age 0, the same path and
                scope attributes as the original cookie); emitted only when
                the revoked id is the current session.
              schema:
                type: string
            X-Request-ID:
              $ref: "#/components/headers/RequestID"
            Cache-Control:
              $ref: "#/components/headers/NoStoreCacheControl"
        "400":
