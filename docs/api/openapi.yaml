  /api/v1/users/me/sessions:
    get:
      operationId: listSessions
      summary: Current user's active sessions
      description: >-
        The authenticated user's own UNEXPIRED sessions, newest sign-in first
        (createdAt DESC, id ASC). An expired row is absent here whether or not
        the bounded cleanup task has run. Ordering, bounds, and the cursor
        follow the shared keyset contract; the cursor namespace is ss1. Each item
        carries the opaque session id, the client label,
        the creation and expiry instants, and current=true for the session
        making the request. Nothing beyond those fields exists to return —
        the session table stores no address, location, or last-seen value.
      parameters:
        - name: limit
          in: query
          required: false
          description: >-
            Page size. Integers from 1 through 100; absent means 20. A
            non-integer or empty value is a 400; an integer outside the
            range is a 422 with violation field "limit". Duplicate or
            unknown query parameters are rejected.
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: after
          in: query
          required: false
          description: >-
            Opaque versioned cursor from a previous pageInfo.endCursor.
            At most 256 characters; any value that does not decode to a
            valid cursor in the ss1. namespace is a 400.
          schema:
            type: string
            maxLength: 256
      responses:
        "200":
          description: The caller's active sessions with continuation metadata.
          headers:
            X-Request-ID:
              $ref: "#/components/headers/RequestID"
            Cache-Control:
              $ref: "#/components/headers/NoStoreCacheControl"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/InvalidCredentials"
        "403":
          $ref: "#/components/responses/PasswordChangeRequired"
        "422":
          $ref: "#/components/responses/Validation"
