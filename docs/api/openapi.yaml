        - title
        - description
        - slug
        - thumbnailPath
        - thumbnailUrl
        - status
        - publishedAt
        - createdAt
        - updatedAt
        - revision
        - creator
        - updater
        - downloads
      properties:
        id:
          type: string
        title:
          type: string
        description:
          type: string
        slug:
          type: string
        thumbnailPath:
          type: string
        thumbnailUrl:
          type: string
          description: >-
            Absolute URL of the served thumbnail; empty string, never null,
