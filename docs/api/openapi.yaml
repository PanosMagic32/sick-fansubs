        - $ref: "#/components/schemas/CommentNotificationItem"
        - $ref: "#/components/schemas/HeartNotificationItem"
        - $ref: "#/components/schemas/CommentRemovedNotificationItem"
        - $ref: "#/components/schemas/ContentUpdatedNotificationItem"
        - $ref: "#/components/schemas/NewContentNotificationItem"
        - $ref: "#/components/schemas/DraftActivityNotificationItem"
      discriminator:
        propertyName: kind
        mapping:
          password_reset: "#/components/schemas/AccountNotificationItem"
          role_changed: "#/components/schemas/AccountNotificationItem"
          user_suspended: "#/components/schemas/AccountNotificationItem"
          user_reactivated: "#/components/schemas/AccountNotificationItem"
          user_deleted: "#/components/schemas/AccountNotificationItem"
          comment_reply: "#/components/schemas/CommentNotificationItem"
          comment: "#/components/schemas/CommentNotificationItem"
          heart: "#/components/schemas/HeartNotificationItem"
          comment_removed: "#/components/schemas/CommentRemovedNotificationItem"
          content_updated: "#/components/schemas/ContentUpdatedNotificationItem"
          new_content: "#/components/schemas/NewContentNotificationItem"
          draft_activity: "#/components/schemas/DraftActivityNotificationItem"
    AccountNotificationItem:
      type: object
      description: >-
        One account audit event in the unified feed. The `kind`
        discriminator carries the former `event` values unchanged. No request_id or
        client address — the deferred audit viewer owns the forensic
        fields. actorUsername is null when the actor has no users row (a
        deleted account or the maintenance pseudo-actor — rendered as a
        system label); targetUsername is null for a deleted target
        (rendered as a placeholder). targetRole is the visibility snapshot
        at emission time; null only defensively — the five feed events
        always carry it.
      additionalProperties: false
      required:
        - id
        - kind
        - result
        - actorUsername
        - targetUsername
        - targetRole
        - createdAt
        - read
      properties:
        id:
          type: string
          description: Opaque audit-event identifier.
        kind:
          type: string
          enum:
            - password_reset
            - role_changed
            - user_suspended
            - user_reactivated
            - user_deleted
          description: The account event kind.
        result:
          type: string
          enum:
            - success
            - failure
        actorUsername:
          oneOf:
            - type: string
            - type: "null"
        targetUsername:
          oneOf:
            - type: string
            - type: "null"
        targetRole:
          oneOf:
            - type: string
            - type: "null"
          description: The target account's role snapshot at emission time.
        createdAt:
          type: string
          format: date-time
          description: Event instant, canonical UTC RFC 3339 with milliseconds.
        read:
          type: boolean
          description: >-
            Whether the VIEWER has already read this entry: the
            user_notifications half answers from the row's own read_at_ms,
            the audit half from the viewer's notification_reads
            mark. Drives the unread styling on /notifications.
    CommentNotificationItem:
      type: object
      description: >-
        One comment-related entry from the viewer's user_notifications rows
        — comment_reply and comment (a new top-level comment on content the viewer follows).
        contentTitle joins the content row at read time regardless of
        status; it is null when the content was hard-deleted (the frontend
        renders a generic label). The client navigates to
        /blog/{contentId}#comment-{commentId} (or /projects/…) — the
        comments deep-link flow.
      additionalProperties: false
      required:
        - id
        - kind
        - actorUsername
        - contentTitle
        - contentKind
        - contentId
        - commentId
        - createdAt
        - read
      properties:
        id:
          type: string
          description: Opaque user_notifications identifier.
        kind:
          type: string
          enum:
            - comment_reply
            - comment
        actorUsername:
          oneOf:
            - type: string
            - type: "null"
          description: >-
            The commenter's username; null for a deleted actor (rendered
            as the system label).
        contentTitle:
          oneOf:
            - type: string
            - type: "null"
          description: >-
            The content title joined at read time regardless of status;
            null for deleted content.
        contentKind:
          type: string
          enum:
            - blog-posts
            - projects
        contentId:
          type: string
          description: Opaque content identifier (the navigation target).
        commentId:
          type: string
          description: Opaque comment identifier (the fragment target).
        createdAt:
          type: string
          format: date-time
          description: Notification instant, canonical UTC RFC 3339 with milliseconds.
        read:
          type: boolean
          description: >-
            Whether the VIEWER has already read this entry: the
            user_notifications half answers from the row's own read_at_ms,
            the audit half from the viewer's notification_reads
            mark. Drives the unread styling on /notifications.
    CommentRemovedNotificationItem:
      type: object
      description: >-
        One comment_removed entry from the viewer's user_notifications rows: a moderator+ deleted a
        comment of the viewer's. The CommentNotificationItem field set with
        two deliberate differences. actorUsername is ALWAYS null — the
        notice never names the moderator (the R5 detail ruling; the
        comment_deleted audit ledger is the accountability record). And the
        client navigates to /blog/{contentId} (or /projects/…) with NO
        fragment: the comment is gone, so a #comment-{commentId} fragment
        could only ever hit the deleted-target notice. commentId still
        carries the removed comment's own id (it is the push tag's
        identifier).
      additionalProperties: false
      required:
        - id
        - kind
        - actorUsername
        - contentTitle
        - contentKind
        - contentId
        - commentId
        - createdAt
        - read
      properties:
        id:
          type: string
          description: Opaque user_notifications identifier.
        kind:
          type: string
          enum:
            - comment_removed
        actorUsername:
          type: "null"
          description: >-
            Always null: the notice is actorless by ruling — the moderator
            is never named to the moderated author.
        contentTitle:
          oneOf:
            - type: string
            - type: "null"
          description: >-
            The content title joined at read time regardless of status;
            null for deleted content.
        contentKind:
          type: string
          enum:
            - blog-posts
            - projects
        contentId:
          type: string
          description: Opaque content identifier (the navigation target).
        commentId:
          type: string
          description: >-
            The removed comment's own id (a polymorphic ref — the row is
            gone). Identifies the notice; never a navigation fragment.
        createdAt:
          type: string
          format: date-time
          description: Notification instant, canonical UTC RFC 3339 with milliseconds.
        read:
          type: boolean
          description: >-
            Whether the VIEWER has already read this entry: the
            user_notifications half answers from the row's own read_at_ms,
            the audit half from the viewer's notification_reads
            mark. Drives the unread styling on /notifications.
    HeartNotificationItem:
      type: object
      description: >-
        One heart entry from the viewer's user_notifications rows. The field
        set mirrors CommentNotificationItem — the hearted comment is
        the deep-link target. The client navigates to
        /blog/{contentId}#comment-{commentId} (or /projects/…) and renders
        the owner's sentence form ("Το σχόλιό σου στο {title} αρέσει σε
        {actor}"). An unheart removes the row in the same transaction; a
        comment hard-delete or an account deletion deliberately leaves the
        notice standing (the dangling-ref design): a hard-deleted
        comment's deep link falls back to the deleted-target notice, and a
        deleted actor renders as the system label.
      additionalProperties: false
      required:
        - id
        - kind
        - actorUsername
        - contentTitle
        - contentKind
        - contentId
        - commentId
        - createdAt
        - read
      properties:
        id:
          type: string
          description: Opaque user_notifications identifier.
        kind:
          type: string
          enum:
            - heart
        actorUsername:
          oneOf:
            - type: string
            - type: "null"
          description: >-
            The hearting user's username; null for a deleted actor (rendered
            as the system label).
        contentTitle:
          oneOf:
            - type: string
            - type: "null"
          description: >-
            The content title joined at read time regardless of status;
            null for deleted content.
        contentKind:
          type: string
          enum:
            - blog-posts
            - projects
        contentId:
          type: string
          description: Opaque content identifier (the navigation target).
        commentId:
          type: string
          description: >-
            Opaque identifier of the hearted comment (the fragment target).
        createdAt:
          type: string
          format: date-time
          description: Notification instant, canonical UTC RFC 3339 with milliseconds.
        read:
          type: boolean
          description: >-
            Whether the VIEWER has already read this entry: the
            user_notifications half answers from the row's own read_at_ms,
            the audit half from the viewer's notification_reads
            mark. Drives the unread styling on /notifications.
    ContentUpdatedNotificationItem:
      type: object
      description: >-
        One content_updated entry from the viewer's user_notifications rows:
        a followed post or project was edited while published. The
        CommentNotificationItem field set
        MINUS commentId — the content itself is the navigation target, so
        the client navigates to /blog/{contentId} (or /projects/…)
        with no fragment.
      additionalProperties: false
      required:
        - id
        - kind
        - actorUsername
        - contentTitle
        - contentKind
        - contentId
        - createdAt
        - read
      properties:
        id:
          type: string
          description: Opaque user_notifications identifier.
        kind:
          type: string
          enum:
            - content_updated
        actorUsername:
          oneOf:
            - type: string
            - type: "null"
          description: >-
            The editor's username; null for a deleted actor (rendered as
            the system label).
        contentTitle:
          oneOf:
            - type: string
            - type: "null"
          description: >-
            The content title joined at read time regardless of status;
            null for deleted content.
        contentKind:
          type: string
          enum:
            - blog-posts
            - projects
        contentId:
          type: string
          description: Opaque content identifier (the navigation target).
        createdAt:
          type: string
          format: date-time
          description: Notification instant, canonical UTC RFC 3339 with milliseconds.
        read:
          type: boolean
          description: >-
            Whether the VIEWER has already read this entry: the
            user_notifications half answers from the row's own read_at_ms,
            the audit half from the viewer's notification_reads
            mark. Drives the unread styling on /notifications.
    NewContentNotificationItem:
      type: object
      description: >-
        One new_content entry from the viewer's user_notifications rows: a new post or project was
        published (its FIRST publication) and the viewer is opted in to
        the broadcast. The ContentUpdatedNotificationItem field set —
        the content itself is the navigation target, so the client
        navigates to /blog/{contentId} (or /projects/…) with no fragment.
      additionalProperties: false
      required:
        - id
        - kind
        - actorUsername
        - contentTitle
        - contentKind
        - contentId
        - createdAt
        - read
      properties:
        id:
          type: string
          description: Opaque user_notifications identifier.
        kind:
          type: string
          enum:
            - new_content
        actorUsername:
          oneOf:
            - type: string
            - type: "null"
          description: >-
            The publisher's username; null for a deleted actor (rendered
            as the system label).
        contentTitle:
          oneOf:
            - type: string
            - type: "null"
          description: >-
            The content title joined at read time regardless of status;
            null for deleted content.
        contentKind:
          type: string
          enum:
            - blog-posts
            - projects
        contentId:
          type: string
          description: Opaque content identifier (the navigation target).
        createdAt:
          type: string
          format: date-time
          description: Notification instant, canonical UTC RFC 3339 with milliseconds.
        read:
          type: boolean
          description: >-
            Whether the VIEWER has already read this entry: the
            user_notifications half answers from the row's own read_at_ms,
            the audit half from the viewer's notification_reads
            mark. Drives the unread styling on /notifications.
    DraftActivityNotificationItem:
      type: object
      description: >-
        One draft_activity entry from the viewer's user_notifications rows:
        UNPUBLISHED content was created, edited, or withdrawn, and the
        viewer was in its audience — the draft-visibility gate. The notice
        is re-gated on read, so it reaches a viewer only while that gate
        still admits them (the row's creator, or a weight strictly above
        the creator's current role); below the staff floor it is omitted
        entirely. The kind
        is STAFF-ONLY and OPT-IN: it is offered to moderator-and-above
        sessions only, defaults OFF at every role, and the server omits it
        from the preference list below that floor. The navigation target is
        the STAFF editor (/admin/blog/{contentId} or
        /admin/projects/{contentId}) — unpublished content has no public
        page. The ContentUpdatedNotificationItem field set plus
        draftAction.
      additionalProperties: false
      required:
        - id
        - kind
        - actorUsername
        - draftAction
        - contentTitle
        - contentKind
        - contentId
        - createdAt
        - read
      properties:
        id:
          type: string
          description: Opaque user_notifications identifier.
        kind:
          type: string
          enum:
            - draft_activity
        actorUsername:
          oneOf:
            - type: string
            - type: "null"
          description: >-
            The writer's username; null for a deleted actor (rendered as
            the system label). The actor is never a
            recipient of its own notice.
        draftAction:
          type: string
          enum:
            - created
            - updated
            - unpublished
          description: >-
            Which unpublished transition the notice reports: created (a new
            draft), updated (an edit that left the row unpublished), or
            unpublished (the row left the published state). The column is
            bound to this kind by a per-kind CHECK (migration 0019), so the
            key is always present here.
        contentTitle:
          oneOf:
            - type: string
            - type: "null"
          description: >-
            The content title joined at read time regardless of status —
            the point of this kind, which names content the public reads
            mask; null for deleted content.
        contentKind:
          type: string
          enum:
            - blog-posts
            - projects
        contentId:
          type: string
          description: Opaque content identifier (the STAFF editor's target).
        createdAt:
          type: string
          format: date-time
          description: Notification instant, canonical UTC RFC 3339 with milliseconds.
        read:
          type: boolean
          description: >-
            Whether the VIEWER has already read this entry: the
            user_notifications half answers from the row's own read_at_ms,
            the audit half from the viewer's notification_reads
            mark. Drives the unread styling on /notifications.
    PushSubscriptionCreate:
      type: object
      description: >-
        The browser's PushSubscription JSON body: the push-service endpoint
        and the RFC 8291 key material. p256dh/auth must be URL-safe base64
        decoding to exactly 65 and 16
        bytes.
      additionalProperties: false
      required:
        - endpoint
        - keys
      properties:
        endpoint:
          type: string
          minLength: 1
          maxLength: 512
          description: Absolute https URL of the push service endpoint.
        keys:
          type: object
          additionalProperties: false
          required:
            - p256dh
            - auth
          properties:
            p256dh:
              type: string
              maxLength: 512
              description: URL-safe base64 decoding to the 65-byte uncompressed P-256 point.
            auth:
              type: string
              maxLength: 512
              description: URL-safe base64 decoding to the 16-byte authentication secret.
    PushSubscriptionCreated:
      type: object
      description: The create response — the stored row id.
      additionalProperties: false
      required:
        - id
      properties:
        id:
          type: string
          description: >-
            Opaque subscription row id (the existing row's id on a
            same-endpoint resubscribe).
    PushSubscriptionList:
      type: object
      description: The settings-list envelope — own subscription rows only.
      additionalProperties: false
      required:
        - subscriptions
      properties:
        subscriptions:
          type: array
          items:
            $ref: "#/components/schemas/PushSubscriptionItem"
    PushSubscriptionItem:
      type: object
      description: One subscription row for the settings list.
      additionalProperties: false
      required:
        - id
        - endpoint
        - createdAt
      properties:
        id:
          type: string
        endpoint:
          type: string
          description: >-
            The push-service endpoint. The list carries it so the client
            can match rows against the browser's local registration.
        createdAt:
          type: string
          format: date-time
          description: Subscription instant, canonical UTC RFC 3339 with milliseconds.
    PushTestResult:
      type: object
      description: >-
        The self-test send result: how
        many of the caller's devices accepted the test message, plus one
        outcome per attempted endpoint so the caller can tell whether THEIR
        OWN device was the refusal.
      additionalProperties: false
      required:
        - delivered
        - endpoints
      properties:
        delivered:
          type: integer
          minimum: 0
          description: >-
            Endpoints that accepted the message (200/201). Zero means
            nothing is subscribed, delivery is disabled on this deployment
            (development without the VAPID secret), or every device was
            rejected by the push service.
        endpoints:
          type: array
          description: >-
            One entry per attempted subscription row, oldest subscription
            first (creation order, id as tiebreak). Empty when nothing is
            subscribed.
          items:
            $ref: "#/components/schemas/PushTestEndpoint"
    PushTestEndpoint:
      type: object
      description: >-
        One endpoint's outcome inside the self-test report. It is the
        caller's own row id, the coarse push-service family, and the
        transport verdict: the endpoint URL, its
        path and the RFC 8291 key material never appear here.
      additionalProperties: false
      required:
        - id
        - service
        - accepted
      properties:
        id:
          type: string
          description: The subscription row id (the caller's own device).
        service:
          type: string
          enum:
            - mozilla
            - fcm
            - apple
            - other
          description: >-
            The push-service family derived from the endpoint host
            (mozilla = Mozilla autopush, fcm = Google FCM, apple = Apple
            push, other = anything else).
        accepted:
          type: boolean
          description: The push service answered 200/201 for this endpoint.
        status:
          type: integer
          description: >-
            The last HTTP status the push service returned, sticky across the
            retry ladder. ABSENT when no attempt received a response at all
            (a pure transport failure or an aborted window) — the one case
            where an unaccepted endpoint carries no number.
        removed:
          type: boolean
          description: >-
            Present and true when the dead-endpoint rule (404/410) deleted
            this row during this very send, so the client can explain why the
            device disappeared.
    NotificationPreferenceList:
      type: object
      description: >-
        The effective per-kind push toggles for every kind the caller's ROLE
        can hold: the six audience kinds (with the stored override or the
        role default — moderator+ on, everyone else off), plus the
        staff-only draft_activity for a moderator-and-above session, which
        is opt-in at every role and omitted below the
        floor.
      additionalProperties: false
      required:
        - preferences
      properties:
        preferences:
          type: array
          items:
            $ref: "#/components/schemas/NotificationPreference"
    NotificationPreference:
      type: object
      description: One kind's effective push toggle.
      additionalProperties: false
      required:
        - kind
        - pushEnabled
      properties:
        kind:
          type: string
          enum:
            - heart
            - comment_reply
            - comment
            - content_updated
            - new_content
            - comment_removed
            - draft_activity
        pushEnabled:
          type: boolean
          description: >-
            The effective value: the stored row, or the KIND's default when
            no row exists — moderator+ true and everyone else false for the
            six audience kinds, and false at every role for the staff-only
            draft_activity.
    NotificationPreferenceUpdate:
      type: object
      description: The PUT body — one explicit toggle.
      additionalProperties: false
      required:
        - pushEnabled
      properties:
        pushEnabled:
          type: boolean
    NotificationList:
      type: object
      description: The notification-feed envelope (items + pageInfo).
      additionalProperties: false
      required:
        - items
        - pageInfo
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/NotificationItem"
        pageInfo:
          $ref: "#/components/schemas/PageInfo"
    UnreadCount:
      type: object
      description: The unread-notification badge payload.
      additionalProperties: false
      required:
        - unread
      properties:
        unread:
          type: integer
          minimum: 0
    CommentAuthor:
      type: object
      description: >-
        The public author projection on a comment: id, username, avatar,
        the derived isStaff badge, and — for STAFF authors only — the
        derived staffRole the badge colors on. A non-staff author's role is
        never exposed: the field is ABSENT (not null, not empty) for
        everyone below moderator. isStaff is moderator and above, so it is
        always true when staffRole is present. avatarUrl is null when the
        author has no avatar or the stored value fails the scheme guard.
      additionalProperties: false
      required:
        - id
        - username
        - avatarUrl
        - isStaff
      properties:
        id:
          type: string
          description: Opaque user identifier.
        username:
          type: string
        avatarUrl:
          oneOf:
            - type: string
            - type: "null"
        isStaff:
          type: boolean
          description: >-
            Derived staff badge (moderator+). Always true for an author that
            carries staffRole; never the raw role by itself.
        staffRole:
          type: string
          enum:
            - moderator
            - admin
            - super-admin
          description: >-
            The author's staff role, exposed ONLY for staff authors (R3) —
            the client colors the badge on it. Omitted entirely for a
            non-staff author.
    Comment:
      type: object
      description: >-
        One comment item. Replies share the shape MINUS the replies,
        replyCount, and repliesEndCursor keys — the wire omits all three for
        reply items. hearted is viewer-aware — one LEFT JOIN with the
        viewing session (false for anonymous reads), which is why comment
        responses are session-dependent and stay no-store.
        createdAt/updatedAt are canonical API instants; the client shows the
        edited marker when updatedAt > createdAt. Comments are the first
        public write surface for regular users; bodies are PLAIN TEXT (never
        rendered as HTML by the client).
      additionalProperties: false
      required:
        - id
        - body
        - author
        - createdAt
        - updatedAt
        - heartsCount
        - hearted
      properties:
        id:
          type: string
          description: Opaque comment identifier.
        body:
          type: string
          description: >-
            The normalized plain-text body (trimmed, CRLF→LF, ≤ 5,000
            runes, control characters rejected).
        author:
          $ref: "#/components/schemas/CommentAuthor"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        heartsCount:
          type: integer
          minimum: 0
          description: The materialized heart count (top sort key).
        hearted:
          type: boolean
          description: Whether the viewing session hearted this comment.
        replies:
          type: array
          items:
            $ref: "#/components/schemas/Comment"
          description: >-
            The item's inline reply window — at most the first 3 replies
            (depth 1), oldest first, or the R4 focus reply page containing
            the anchor when a deep link targets a reply outside that first
            window. Present ONLY on top-level
            items ([] when none; reply items omit the key entirely). Append
            the remainder through the replies operation, starting from
            repliesEndCursor.
        replyCount:
          type: integer
          minimum: 0
          description: >-
            The total number of replies (R4) — present ONLY on top-level
            items; replies holds at most the first 3 of them.
        repliesEndCursor:
          type: string
          description: >-
            Opaque continuation for the item's remaining replies (namespace
            br1./pr1.) — present ONLY on top-level items while replies exist
            after the shipped window, and omitted once the window is
            complete. Use it as the replies operation's after parameter.
    CommentList:
      type: object
      description: The comment-thread envelope (items + pageInfo).
      additionalProperties: false
      required:
        - items
        - pageInfo
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Comment"
        pageInfo:
          $ref: "#/components/schemas/PageInfo"
    CommentCount:
      type: object
      description: >-
        The total comment count (top-level + replies) — the standalone
        count endpoint (the no-count-for-envelope rule).
      additionalProperties: false
      required:
        - count
      properties:
        count:
          type: integer
          minimum: 0
    CommentBodyRequest:
      type: object
      description: >-
        The comment create/edit body. body is plain
        text only: trimmed, non-empty, CRLF normalized to LF, at most
        5,000 runes, control characters rejected (LF and TAB excepted).
        Violations: {body, required} (empty), {body, maxLength} (> 5,000
        runes), {body, invalidFormat} (control characters — rejected,
        never silently stripped). Format characters (bidi/zero-width) are
        NOT control characters: they pass and render as text, so their
        effects stay inside the comment's own text block (bidi reordering,
        zero-width spacing/line-break control) — never markup or another
        element's layout. Unknown fields are rejected (strict decode); the
        request body is byte-bounded at ~32 KiB (413).
      additionalProperties: false
      required:
        - body
      properties:
        body:
          type: string
          maxLength: 5000
          description: The plain-text comment body.
  responses:
    BadRequest:
      description: Malformed request (400) — problem type /problems/bad-request.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestID"
        Cache-Control:
          $ref: "#/components/headers/NoStoreCacheControl"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    InvalidCredentials:
      description: Generic 401 — problem type /problems/auth/invalid-credentials.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestID"
        Cache-Control:
          $ref: "#/components/headers/NoStoreCacheControl"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    AlreadyAuthenticated:
      description: >-
        403 — problem type /problems/auth/already-authenticated when a
        session already exists, or /problems/forbidden for a trusted-origin
        or CSRF failure on the same request.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestID"
        Cache-Control:
          $ref: "#/components/headers/NoStoreCacheControl"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    ResetTokenInvalid:
      description: >-
        422 — problem type /problems/auth/reset-token-invalid: a missing,
        expired, already-used, or malformed reset token, or a suspended
        account — one generic outcome, no distinction.
        Password-policy violations on the same endpoint use the
        /problems/validation shape instead.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestID"
        Cache-Control:
          $ref: "#/components/headers/NoStoreCacheControl"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    VerificationTokenInvalid:
      description: >-
        422 — problem type /problems/auth/verification-token-invalid: a
        missing, expired, already-used, or malformed verification token, or
        a suspended account — one generic outcome, no distinction.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestID"
        Cache-Control:
          $ref: "#/components/headers/NoStoreCacheControl"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Forbidden:
      description: >-
        403 — problem type /problems/forbidden (CSRF/origin failure or a role
        floor) or /problems/auth/password-change-required (the forced-change
        gate — see PasswordChangeRequired).
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestID"
        Cache-Control:
          $ref: "#/components/headers/NoStoreCacheControl"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    PasswordChangeRequired:
      description: >-
        403 — problem type /problems/auth/password-change-required: the
        session's account carries the forced-change flag and the endpoint sits
        on a chain with the forced-change gate. The /api/v1/auth/ subtree never
        carries the gate, so its paths (password change, sign-out, session
        bootstrap, reset, resend-verification) stay reachable while flagged.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestID"
        Cache-Control:
          $ref: "#/components/headers/NoStoreCacheControl"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Conflict:
      description: 409 duplicate race — problem type /problems/conflict.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestID"
        Cache-Control:
          $ref: "#/components/headers/NoStoreCacheControl"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    LastSuperAdminConflict:
      description: >-
        409 — problem type /problems/auth/last-super-admin: the operation
        (role demotion, deletion, or suspension) would leave zero ACTIVE
        super-admin accounts.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestID"
        Cache-Control:
          $ref: "#/components/headers/NoStoreCacheControl"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    PayloadTooLarge:
      description: 413 body over the endpoint's documented body limit — problem type /problems/payload-too-large.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestID"
        Cache-Control:
          $ref: "#/components/headers/NoStoreCacheControl"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    MediaTooLarge:
      description: >-
        413 upload over the 10 MB file bound or the multipart framing bound
        (the file bound plus 1 MiB), or over the 2^24 total-pixel or
        8192-per-axis processing limits — problem type /problems/validation
        with violations [{file, tooLarge}].
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestID"
        Cache-Control:
          $ref: "#/components/headers/NoStoreCacheControl"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    PreconditionRequired:
      description: 428 missing If-Match — problem type /problems/precondition-required.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestID"
        Cache-Control:
          $ref: "#/components/headers/NoStoreCacheControl"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    PreconditionFailed:
      description: 412 stale If-Match revision — problem type /problems/precondition-failed.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestID"
        Cache-Control:
          $ref: "#/components/headers/NoStoreCacheControl"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    UnsupportedMediaType:
      description: 415 non-JSON Content-Type — problem type /problems/unsupported-media-type.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestID"
        Cache-Control:
          $ref: "#/components/headers/NoStoreCacheControl"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    NotFound:
      description: >-
        404 — problem type /problems/not-found: an unknown path under /api/v1
