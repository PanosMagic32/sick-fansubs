name: ci

# The PR/push gate: every push to main and every pull request runs the same
# suite the deploy workflow's test job runs before a tag builds. Keep the two
# in step with make check — a suite member that lands in one but not the
# other drifts the gates apart.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    # Hang-brake: a hung step otherwise holds the runner for up to the 6 h
    # default.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          # CI never pushes, so no git token lands in the local git config
          # where a compromised action could read it (contents: read already
          # blocks writes — this removes the credential itself).
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27.1"
      - uses: oven-sh/setup-bun@v2
        with:
          # Keep in step with the oven/bun tag in the Dockerfile.
          bun-version: "1.4.2"
      - name: Go build/vet/format
        run: |
          go build ./...
          go vet ./...
          test -z "$(gofmt -l cmd internal)" || (echo "gofmt found unformatted files" && exit 1)
      - name: Docs guard (make docs-lint)
        run: go run ./cmd/docslint
      - name: Workflow lint (make workflow-lint)
        run: go tool actionlint -shellcheck=
      - name: Go tests
        run: go test ./internal/... ./cmd/... -count=1
      - name: Web install/typecheck/tests
        working-directory: web
        run: |
          bun install --frozen-lockfile
          bunx tsc --noEmit
          bun test
