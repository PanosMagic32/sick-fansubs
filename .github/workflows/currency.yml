name: currency

# Weekly dependency-currency report (docs/ops/currency.md): what drifted and
# what the vulnerability scanners find. Report-only — upgrades land by review
# through the normal gate. govulncheck's non-zero exit on a finding is the
# intended signal here.
on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          # CI never pushes, so no git token lands in the local git config
          # where a compromised action could read it.
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27.1"
      - uses: oven-sh/setup-bun@v2
        with:
          # Keep in step with the oven/bun tag in the Dockerfile.
          bun-version: "1.4.2"
      - name: Go module drift (go list -m -u all)
        run: go list -m -u all
      - name: Go vulnerability scan (govulncheck)
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
      - name: Web dependency drift (bun outdated)
        working-directory: web
        # bun outdated exits non-zero when it reports drift; this job is a
        # report, so the listing must not fail the run.
        run: bun outdated || true
